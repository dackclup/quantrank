name: Precache EDGAR Caches

# Issue #249 Option B — off-cycle SEC EDGAR cache warmer.
#
# WHY: the 2026-05-25 P1 — a full-cold 5-EDGAR-loop run blew the weekday
# cron's `timeout-minutes` (warm runs are fine at ~12-25 min; full-cold is
# > 2.5 h). This workflow's SOLE purpose is to warm the two actions/cache
# bundles the weekday cron (compute-rankings.yml) restores, on a day when
# nothing depends on the result:
#
#   - Saturday 08:00 UTC is off-cycle BY CONSTRUCTION (weekday cron fires
#     Mon-Fri 22:00 UTC), and a worst-case cold rebuild (< 4 h) finishes
#     long before Monday. There is deliberately NO trading-day gate — this
#     runs on a non-trading day on purpose.
#   - It runs the REAL pipeline (`python -m compute.main`) with ALL loops
#     enabled — none of the QR_SKIP_* / FORM4_FETCH_SKIP escape hatches
#     from pre-merge-prod-sim.yml: Tier-2 text + Form-4 warming is the
#     entire point.
#   - Outputs are DISCARDED: no commit step, no PIT-backtest refresh, no
#     artifact upload of frontend/public/data/. The only durable product
#     is the post-job cache save.
#
# EXACT-KEY SAVE SEMANTICS (why this warms correctly at ~zero steady-state
# cost): the FAST bundle uses the cron's EXACT quarter key, and
# actions/cache skips the post-job save on an exact-key hit, so:
#   - quarter key present  -> cheap warm pass (~15-25 min), save skipped;
#   - key EVICTED (the #249 trigger: idle-weekend / 10 GB-LRU eviction) or
#     quarter rolled -> THIS run eats the cold rebuild and SAVES under the
#     quarter key, so Monday's cron restores warm — precisely the recovery
#     semantics #249 wants.
# The SLOW-TEXT bundle uses the cron's run-id-keyed family: a unique key
# per run means the save is NEVER skipped, so every Saturday persists a
# fresh text snapshot and the weekday cron restores the latest by prefix.
# CAVEAT (shared with the cron): actions/cache's post-job save only runs
# when the job SUCCEEDS — a timed-out cold rebuild persists nothing. The
# 270-min budget exists precisely so the cold pass can finish (bumped from
# 240 — first cold sp1500 cron ran ~196 min compute alone, see job comment).
#
# Bump cache families here IN LOCKSTEP with compute-rankings.yml (see
# tests/test_workflow_cache_coverage.py — the guard asserts both workflows
# restore every compute.config cache dir and share the same key families).

on:
  schedule:
    # Sat 08:00 UTC — see the off-cycle rationale in the header comment.
    - cron: "0 8 * * 6"
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe to precache. sp1500 = warms the full S&P 1500 (~1500 names: sp500 + sp400 + sp600; Slice 7 cron-default 2026-06-20 — the scheduled Saturday precache now matches Monday's cron default). sp900 = S&P 500 + S&P 400 (~903 names; prior default pre-Slice 7; use for diagnostics or rollback testing). sp500 = large-cap only (diagnostic / fallback). Default sp1500 for the scheduled Saturday run so it warms the same universe as Monday's cron (precache-must-match-cron invariant)."
        type: choice
        options:
          - sp500
          - sp900
          - sp1500
        default: sp1500

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  # S&P 1500 cutover Slice 7 (2026-06-20): the `|| 'sp1500'` fallback makes
  # the scheduled Saturday precache warm the SAME universe as the weekday cron
  # (also sp1500 after the Slice 7 flip — precache-must-match-cron invariant).
  # Prior value: || 'sp900' (precache-900 Phase B flip, #492, 2026-06-16).
  # A manual `universe: sp900` or `universe: sp500` dispatch is available for
  # diagnostics or rollback. Env-block assignment is injection-safe (mirrors #480).
  # Revert: change || 'sp1500' back to || 'sp900' and update dispatch input default.
  QR_UNIVERSE: ${{ github.event.inputs.universe || 'sp1500' }}

# Never pushes, never comments — read is all it needs (least-privilege per
# the compute-rankings.yml precedent, security-reviewer 2026-05-23 W2).
permissions:
  contents: read

# Shared with compute-rankings.yml (see the rationale comment there): the
# precache and the weekday cron write the SAME cache bundles and must never
# run concurrently. `cancel-in-progress: false` queues instead of cancels.
concurrency:
  group: edgar-cache-writers
  cancel-in-progress: false

jobs:
  precache:
    runs-on: ubuntu-latest
    # Cold worst-case headroom — S&P 1500 EMPIRICAL BASELINE (cron run
    # 27902140692, 2026-06-21, ~1504 names, ~196 min cold compute):
    #   Cold compute (no backtest step — this workflow discards outputs):
    #     ~196 min (same as compute-rankings.yml cold compute total)
    #   + 10% SEC throttle spike:  ~215-220 min
    #   + runner overhead:         ~5-10 min
    #   Ceiling:                   ~225 min cold worst-case
    # Typical warm Saturday ≈ 15-25 min (exact-key fast-cache hit).
    # 270 min ceiling (lockstep with compute-rankings.yml bump) gives
    # ~45 min buffer over the cold worst-case — wider than the cron's
    # ~20 min buffer because this workflow omits the 55m folded backtest.
    # The 240-min budget was adequate for sp900 (~140-160 min cold) but
    # became dangerously tight at sp1500 scale; bumped in lockstep so a
    # Saturday cold rebuild can always complete and save the cache bundles
    # (actions/cache post-job save only runs on job SUCCESS).
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Mirror compute-rankings.yml exactly — compute/ingest/osap.py
          # imports `openassetpricing` from the `factors` extra.
          pip install -e ".[factors]"

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      # BOTH cache steps below mirror compute-rankings.yml EXACTLY (paths,
      # keys, restore-keys). The exactness is load-bearing: the fast bundle
      # must exact-hit the cron's quarter key to no-op the save on warm
      # Saturdays, and must SAVE under that same key after an eviction so
      # the weekday cron restores warm. Lockstep guard:
      # tests/test_workflow_cache_coverage.py.
      # v11-fast (S&P 1500 cutover Slice 5, 2026-06-20): added sp600/sp1500 universe
      # parquets to path: so they persist in the fast bundle. The fast bundle's
      # exact-key save-skip means sp600 fundamentals/prices written under a warm v10
      # sp900 key would be silently dropped; v11 forces a cold-seed of the full sp1500
      # fast bundle on the first post-flip cron so all ~1500 tickers warm correctly.
      # Same mechanism as the v9→v10 flip (precache-900 Phase B, #492). The cron
      # default stays sp900 — this key bump ONLY enables the sp1500 manual dispatch
      # and seeds the cache so Slice 7 (the cron-default flip) has a warm bundle.
      # Do NOT bump the slow-text bundle key — it is run-id-keyed and always saves.
      - name: Restore fast caches (fundamentals / prices)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            compute/cache/fundamentals
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe-v2.parquet
            compute/cache/universe_sp400-v1.parquet
            compute/cache/universe_sp900-v1.parquet
            compute/cache/universe_sp600-v1.parquet
            compute/cache/universe_sp1500-v1.parquet
            compute/cache/yfinance_info
          key: cache-v11-fast-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v11-fast-${{ steps.quarter.outputs.q }}-
            cache-v11-fast-

      - name: Restore slow text caches (edgar_10k_text / edgar_8k / edgar_form4 / osap)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            compute/cache/edgar_10k_text
            compute/cache/edgar_8k
            compute/cache/edgar_amendments
            compute/cache/edgar_late_filings
            compute/cache/edgar_form4
            compute/cache/osap
          key: cache-v5-text-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cache-v5-text-${{ runner.os }}-

      # Issue #249 Option C — post-restore canary. Emits per-layer size /
      # file count / newest-file age into the log + a $GITHUB_STEP_SUMMARY
      # table, so cache eviction is visible in ~30 s instead of after hours
      # of SEC polling. Dependency-free shell (find/du/awk only).
      # DELIBERATE DEVIATION from the issue's "loud signal": the cold
      # signal is a ::warning::, NOT a fail-fast — with this Option-B
      # warmer in place, a cold cache here usually means an INTENTIONAL
      # rebuild (cache-family vN bump, quarter rollover, post-eviction
      # dispatch), and failing fast would self-abort exactly the run whose
      # job is to re-warm the cache.
      # Keep this step textually IDENTICAL to its sibling in
      # compute-rankings.yml so future edits stay in lockstep.
      # Expected steady-state warm sizes (empirical, Issue #287 PR A):
      #   fundamentals/           ~80-120 MB   (502 parquets)
      #   fundamentals_history/   ~40-60 MB    (502 parquets)
      #   prices/                 ~20-40 MB    (502 parquets)
      #   edgar_8k/               ~10-30 MB
      #   edgar_10k_text/         ~50-150 MB   (lazy: ~80% present)
      #   yfinance_info/          ~5-20 MB
      #   edgar_amendments/       ~2-10 MB
      #   edgar_late_filings/     ~1-5 MB
      #   edgar_form4/            ~5-15 MB     (502 dirs)
      #   osap/                   ~1-5 MB      (parquet)
      - name: "Cache restore canary (Issue #287 PR A + #249 Option C)"
        run: |
          echo "=== Cache restore canary (Issues #287 + #249) ==="
          now=$(date +%s)
          {
            echo "## Cache restore canary"
            echo ""
            echo "| Cache layer | Size | Files | Newest-file age |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          emit() {
            path="$1"
            if [ -e "$path" ]; then
              size=$(du -sh "$path" 2>/dev/null | cut -f1)
              files=$(find "$path" -type f 2>/dev/null | wc -l)
              newest=$(find "$path" -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)
              if [ -n "$newest" ]; then
                age="$(awk -v now="$now" -v ts="${newest%.*}" 'BEGIN { printf "%.1f", (now - ts) / 3600 }')h"
              else
                age="empty"
              fi
              echo "  $path: ${size}, ${files} files, newest age ${age}"
              echo "| \`$path\` | $size | $files | $age |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  $path: MISSING (cold — not in restored cache)"
              echo "| \`$path\` | MISSING | 0 | — |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          # Union of the declared cache layers (so MISSING rows still print
          # on a cold runner) + whatever else exists under compute/cache/
          # (so a newly-added layer shows up even before this list is
          # extended).
          layers=$(
            {
              printf '%s\n' \
                compute/cache/fundamentals \
                compute/cache/fundamentals_history \
                compute/cache/prices \
                compute/cache/edgar_8k \
                compute/cache/edgar_10k_text \
                compute/cache/yfinance_info \
                compute/cache/edgar_amendments \
                compute/cache/edgar_late_filings \
                compute/cache/edgar_form4 \
                compute/cache/osap
              find compute/cache -mindepth 1 -maxdepth 1 -type d 2>/dev/null
            } | sort -u
          )
          for d in $layers; do emit "$d"; done
          emit compute/cache/universe-v2.parquet
          # Cold signal: Form-4 + 10-K-text are the two most expensive loops
          # to rebuild (the #249 timeout drivers). Warning, NOT fail-fast —
          # see the step comment above for why.
          form4_n=$(find compute/cache/edgar_form4 -type f 2>/dev/null | wc -l)
          tenk_n=$(find compute/cache/edgar_10k_text -type f 2>/dev/null | wc -l)
          if [ "$form4_n" -eq 0 ] || [ "$tenk_n" -eq 0 ]; then
            echo "::warning::cache cold — expect a long run (see #249)"
            {
              echo ""
              echo "> **WARNING — cache cold**: the Form-4 and/or 10-K-text layer is empty; expect a long run (see #249)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # TTL-proximity warning (Issue #469): the edgar_8k event cache has a
          # 144h (6-day) TTL — config.EDGAR_8K_CACHE_TTL_SECONDS = 6 * 86400. All
          # 502 tickers are written in one cold-rebuild burst, so when the layer's
          # NEWEST file nears 144h the next tier2 pass refetches all of them live
          # (~80 min). Recompute that newest-file age the same way emit() does
          # (find -printf '%T@' | sort | tail -1) and warn at > 72h
          # (= 144h TTL - 72h, the config.EDGAR_8K_CACHE_TTL_JITTER_SECONDS window)
          # so the long pass is PREDICTED here, not a surprise next run. Warning
          # only — the guarded awk/echo can never fail the job.
          k8_newest=$(find compute/cache/edgar_8k -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)
          if [ -n "$k8_newest" ]; then
            k8_age=$(awk -v now="$now" -v ts="${k8_newest%.*}" 'BEGIN { printf "%.1f", (now - ts) / 3600 }')
            # 72 = 144 (EDGAR_8K_CACHE_TTL_SECONDS, hours) - 72 (EDGAR_8K_CACHE_TTL_JITTER_SECONDS, hours)
            if awk -v a="$k8_age" 'BEGIN { exit !(a > 72) }'; then
              echo "::warning::edgar_8k cache within 72h of its 144h TTL (newest age ${k8_age}h) — next tier2 pass will refetch ~502 tickers live (~80 min); see #469"
              {
                echo ""
                echo "> **WARNING — edgar_8k near TTL**: newest file is ${k8_age}h old (144h TTL); the next tier2 pass will refetch ~502 tickers live (~80 min). See #469."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "=== End canary ==="

      # The real pipeline, all loops enabled. Everything it writes under
      # frontend/public/data/ is discarded with the runner; the post-job
      # cache saves are the product.
      - name: Run weekly compute (outputs discarded — cache warm only)
        run: python -m compute.main

      # Per-loop wall-clock + fundamentals latency into the run Summary —
      # answers "what did this warmer actually have to fetch?" at a glance.
      # `if: always()` so a compute abort still prints what ran. Graceful on
      # missing fields (older schema) AND on a stale file: checkout ships
      # main's last COMMITTED metadata.json, so if compute aborted before
      # the JSON write we must not report the previous cron's numbers as
      # this run's.
      - name: Precache timing summary (per-loop wall-clock + latency)
        if: always()
        run: |
          if git diff --quiet -- frontend/public/data/metadata.json; then
            msg="metadata.json unchanged from checkout — compute did not reach the JSON write; no per-loop timing for this run."
            echo "$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("frontend/public/data/metadata.json")
          if not p.exists():
              print("metadata.json not found — compute did not reach the JSON write.")
              raise SystemExit(0)
          m = json.loads(p.read_text())
          def fmt(v):
              return f"{v/60:.1f} min ({v:.0f}s)" if isinstance(v, (int, float)) else "— (skipped / not reached)"
          def sec(v):
              return f"{v:.2f}s" if isinstance(v, (int, float)) else "—"
          rows = [
              ("tier2 (10-K + 8-K)", m.get("tier2_wall_clock_seconds")),
              ("Step 8 (cross-source + ensemble + writes)", m.get("cross_source_wall_clock_seconds")),
              ("OSAP", m.get("osap_wall_clock_seconds")),
              ("Form-4", m.get("form4_wall_clock_seconds")),
          ]
          lines = ["## Precache timing (per-loop wall-clock)", "", "| Loop | Wall-clock |", "|---|---|"]
          for name, v in rows:
              lines.append(f"| {name} | {fmt(v)} |")
          lines += [
              "",
              f"_fundamentals latency p50 {sec(m.get('fundamentals_latency_p50_seconds'))} · "
              f"p95 {sec(m.get('fundamentals_latency_p95_seconds'))} · "
              f"coverage {m.get('fundamentals_coverage_pct')}% · "
              f"tier2 coverage {m.get('tier2_coverage_pct')}%_",
              "",
              "_Outputs are DISCARDED — this run exists only to warm the actions/cache bundles (Issue #249 Option B)._",
          ]
          out = "\n".join(lines)
          print(out)
          sp = os.environ.get("GITHUB_STEP_SUMMARY")
          if sp:
              with open(sp, "a") as fh:
                  fh.write(out + "\n")
          PY
