name: Compute Monthly

on:
  schedule:
    - cron: "0 3 1 * *"  # 1st of month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Monthly retrain (Phase 0 stub)
        run: echo "Phase 0 stub — ML retrain lands in Phase 5."
