name: Pre-Merge Production Simulation

# Epic #125 Item 3 — close the gap between CI-green and provably-correct.
#
# CI (ci.yml) verifies that the code lints, the schema is consistent, and the
# unit tests pass. None of those catch a composite-score regression that only
# materialises against the full S&P 500 universe with real EDGAR data — the
# Phase 4h.2 Part 1 silent-drop (issue #116) was the forcing example.
#
# This workflow runs the weekly compute against the PR branch using the warm
# cache the weekly cron (`compute-rankings.yml`) leaves behind, then posts a
# sticky PR comment with:
#   - PR 1 (#140): duration, universe size, schema version, output artifact
#   - PR 2 (this file): composite-score diff vs main + top-10 movers table +
#     universe-size delta + failure-path comment on compute step failure.
#
# Baseline for the diff = main's COMMITTED `frontend/public/data/` (read via
# `git show origin/main:...`), not a fresh re-run on main. Rationale: the
# diff answers "did this PR change what production shows users?" — the right
# anchor is the last-committed main output, not a counterfactual fresh run.
# Free (no second compute), no doubled EDGAR rate-limit pressure.
#
# This check is intentionally NOT a required status — it's informational only,
# slow (~10-15 min warm), and unavailable on fork PRs (no secrets).

on:
  pull_request:
    paths:
      - "compute/scoring/**"
      - "compute/features/**"
      - "compute/ingest/**"
      - "compute/valuation/**"
      - "compute/output/schemas.py"
      - "compute/main.py"
      # NOTE: `pyproject.toml` was REMOVED from this list (2026-06-22) — a
      # version bump / dev-dep bump / release-PR pyproject edit must NOT trigger
      # a ~200-min cold sp1500 simulation. The sim is informational-only and NOT
      # a required check, so skipping it on a non-compute change is safe; offline
      # pytest + the next scheduled cron catch any real regression. If a RUNTIME
      # dependency edit ever needs simulating, re-run this workflow manually.

# Latest push on a PR cancels any in-flight simulation for the same PR.
# A 15-min compute against a stale revision is dead weight.
concurrency:
  group: pre-merge-prod-sim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  # 2026-05-22 — pre-merge-prod-sim skips the Form-4 fetch loop.
  # The Form-4 cache is brand-new (introduced by PR-2, this same
  # branch's parent PR) and never populated by any prior cron, so
  # every sim run is cold-cache. 502 tickers × N filings × per-
  # filing HTTP = exceeds the 45-min CI cap. Form-4 is observability
  # ONLY (form4_enabled=False; _FORM4_FLAGS_ENABLED=False) → zero
  # scoring impact → the composite-score diff that this sim checks
  # is unaffected by skipping the fetch. Weekly cron (compute-
  # rankings.yml, default 360-min budget) still runs the full
  # fetch and populates the cache for future sims.
  # #616 (2026-06-30) — the sim DELIBERATELY no longer mirrors the cron's
  # universe. It pins sp500 while the weekday cron ranks the full sp1500.
  # Why: on a PR-branch cache MISS (GitHub scopes caches per branch; a fresh
  # `main` cron save is not always visible to a PR run) a cold sp1500 sim
  # cold-fetches ~1500 names over ~3.6h and intermittently trips the ~4h
  # hosted-runner stability ceiling (the "runner lost communication" failure).
  # sp500 cold is ~43 min — it still fetches live (real fundamentals → a real
  # composite-score diff, NOT a degraded one) but the smaller universe stays
  # comfortably under the ceiling. (The skip-live-fetch approach #616 Option 4a
  # was tried and REVERTED: on a full cold miss it suppressed all prices → 0
  # tickers priced < MIN_VALID_TICKERS=100 → the compute aborted with no output,
  # i.e. it traded "slow but completes" for "fast abort" — strictly worse.)
  # TRADEOFF: the diff is computed on the sp500 ∩ committed-main intersection;
  # the ~1000 sp400/sp600 names show as "tickers in main only", and a regression
  # specific to a midcap/smallcap INGEST path is not exercised by the sim. That
  # is acceptable because (a) the sim is informational-only / non-required, (b)
  # the weekday cron still runs the full sp1500 and the post-cron audits cover
  # the small/mid-cap paths, (c) most scoring/valuation/output logic is
  # universe-agnostic so an sp500 sim still catches the vast majority of real
  # regressions. Pinned explicitly so the sim's universe is independent of the
  # compute/config.py code default ('sp500' for local-dev safety).
  # — GOTCHAS.md §pre-merge-prod-sim mirroring invariant (the #616 exception).
  QR_UNIVERSE: sp500
  FORM4_FETCH_SKIP: "1"
  # 2026-05-24 — pre-merge-prod-sim skips the Tier-2 (10-K text + 8-K)
  # fetch loop too. The Tier-2 loop is 502 tickers × (10-K full-text
  # download for going-concern phrase scan + 8-K filing list); cold-
  # cache cost is 20-35 min ALONE. Paired with fundamentals warm-up
  # (~10 min on partial cache hit), the budget breaches the 45-min
  # cap → cancelled at the deadline (e.g., PR #230 2026-05-24).
  # `QR_SKIP_TIER2` is the existing kill-switch wired in
  # `compute/scoring/tier2.py:158` since the module's introduction;
  # we just never set it here. Tradeoff: the simulate's composite-
  # score diff is unchanged (Tier-2 going_concern is annotate-only;
  # the non_reliance veto, enabled since PR 4g, is suppressed in
  # this run — acceptable because simulate is informational-only
  # and the veto logic is covered by offline pytest). Weekly cron
  # (compute-rankings.yml) does NOT set this — full Tier-2 still
  # runs there and populates the warm cache for future sims.
  QR_SKIP_TIER2: "1"
  # 2026-05-24 (PR #230 Part 4) — fundamentals freshness-gate skip.
  # The QR_SKIP_TIER2 fix above eliminated 20-35m of cold Tier-2
  # cost but simulate STILL cancelled at 45m. Root cause: even when
  # cached fundamentals parquets exist (restored from the weekly
  # cron), `compute/ingest/fundamentals.py:_is_fresh()` gates by
  # filing_date — any ticker whose latest SEC filing is >45 days
  # old (FUNDAMENTALS_REFETCH_DAYS=45) gets a live EDGAR re-fetch.
  # 502 tickers × ~8 workers vs SEC's 10 req/s ceiling = 25-50 min
  # alone, enough to fill the entire 45m budget. QR_SKIP_FUNDAMENTALS
  # forces use of the cached parquet without the freshness check.
  # SAFE for simulate because: (a) the diff compares PR-branch vs
  # main's COMMITTED rankings.json, both produced from the SAME
  # weekly-cron cache — using that cache without re-fetch is the
  # correct input, not a quality compromise; (b) falls through to
  # live fetch if no cache exists (cold runner has nothing to read).
  # Weekly cron (compute-rankings.yml) does NOT set this — full
  # fundamentals fetch runs there.
  QR_SKIP_FUNDAMENTALS: "1"
  # 2026-05-24 (PR #230 Part 5 follow-up) — pre-merge-prod-sim skips
  # the OSAP bulk fetch too. Parts 1-4 above killed three SEC EDGAR
  # loops (Form-4, Tier-2, fundamentals × 2) but left the 4th
  # external-data fetch — OSAP / openassetpricing.com — running
  # unconditionally. ci-triage-engineer session 6 root-cause: the
  # `compute/cache/osap/` directory was missing from BOTH workflow
  # cache `path:` blocks, so every simulate started with an EMPTY
  # OSAP cache. `fetch_osap_returns` then hits a 30-second to
  # 45-minute live download from openassetpricing.com (single host,
  # no SLA, tenacity 2-attempt × 30s stop_after_delay). When this
  # was combined with any small fundamentals fall-through or
  # cache-restore partial miss it pushed simulate past the 45-min
  # cap on PR #238 (`cdf70bd`). Fix is two-part: (a) add
  # `compute/cache/osap` to BOTH workflow cache paths below + in
  # compute-rankings.yml (so weekly cron populates the warm cache);
  # (b) wire `QR_SKIP_OSAP=1` here as the defense-in-depth backstop
  # for cache-evicted scenarios. Weekly cron does NOT set this —
  # full live fetch runs there once a week.
  QR_SKIP_OSAP: "1"
  # 2026-05-24 (PR #230 Part 6 — the 5th loop) — pre-merge-prod-sim
  # also skips the cross-source yfinance.info validation loop. Even
  # with the four prior skip vars (FORM4_FETCH_SKIP + QR_SKIP_TIER2 +
  # QR_SKIP_FUNDAMENTALS + QR_SKIP_OSAP) ALL set + `compute/cache/yfinance_info`
  # already in the workflow cache `path:` block, the simulate STILL
  # cancelled at 45m14s on PR #241. Root cause: yfinance_info has a
  # 24-hour freshness TTL in `_cache_read`. The weekly cron writes
  # the cache Friday 22:00 UTC, but a Sunday simulate's cache restore
  # gives 39-hour-old entries → fails freshness check → 502-ticker
  # serial `yf.Ticker(ticker).info` cold fetch (2-8s per ticker with
  # tenacity `wait_exponential(min=1, max=10)` × 3 attempts) = 17-67
  # minutes alone. ci-triage-engineer session-6 root-cause from
  # exhaustive code walk of compute/main.py's external-data loops.
  # Wired in `compute/ingest/cross_source.py:fetch_yfinance_market_cap`
  # at the TOP of the function: when set, stale-but-present cache
  # entries are read directly (bypassing the 24h TTL); when cache
  # is genuinely empty, returns None (skip the cross-source check
  # entirely — semantically identical to a cold-cache fetch failure
  # which the call site already handles).
  QR_SKIP_CROSS_SOURCE: "1"
  # 2026-06-22 (PR #558 triage — the 6th loop) — pre-merge-prod-sim
  # also skips the SEC API health probe. Dependabot PRs run on a
  # same-repo branch (the `head.repo.full_name == github.repository`
  # fork guard at the job `if:` PASSES — Dependabot PRs are not forks),
  # but since GitHub's 2021 Dependabot secret-isolation change they
  # cannot read repository secrets: `secrets.EDGAR_USER_AGENT` expands
  # to an empty string. `run_weekly_compute` opens with a SEC health
  # probe (`assert_sec_api_usable`) that hard-aborts immediately when
  # the user-agent is empty → RuntimeError → exit 1 → COMPUTE_OUTCOME
  # =failure in ~90s, on ANY Dependabot PR that touches a `paths:`
  # trigger file (e.g. `pyproject.toml`). The probe is meaningless for
  # the simulate job anyway — it runs against synthetic/cached data
  # with the five skip vars above, never a live SEC fetch. Wired in
  # `compute/ingest/sec_health.py` (`QR_SKIP_SEC_HEALTH` short-circuits
  # the probe to a healthy `error="skipped"` result). Surfaced by the
  # #558 pytest-cov bump whose `simulate` failed twice (re-run identical)
  # despite the dep being `[dev]`-only and never installed by the job's
  # `.[factors]` install.
  QR_SKIP_SEC_HEALTH: "1"
  # Phase 9.1b — pre-merge-prod-sim skips the Broad Investable US universe
  # probe.  The probe calls either the edgartools bundled parquet (no network)
  # or the live SEC company_tickers.json endpoint (requires EDGAR_USER_AGENT
  # and a network round-trip).  Dependabot PRs run with an empty
  # EDGAR_USER_AGENT (GitHub secret-isolation since 2021) so the live path
  # would raise a hard EnvironmentError rather than gracefully degrade — the
  # sim would succeed but emit a warning-level error that pollutes the diff
  # comment.  Even on regular PRs the bundled-parquet path is non-deterministic
  # (depends on the edgartools version cached on the runner) and the live fetch
  # adds latency to a sim that already runs close to the 270-min ceiling.
  # `_run_broad_universe_probe` reads BROAD_UNIVERSE_SKIP_ENV_VAR and returns
  # the all-None dict immediately, leaving the 6 broad_universe_* Metadata
  # fields as None — byte-identical for the composite-score diff this sim
  # checks.  The weekday cron (compute-rankings.yml) does NOT set this flag
  # so the probe runs there and populates the canary Metadata fields.
  QR_SKIP_BROAD_UNIVERSE: "1"

permissions:
  contents: read
  pull-requests: write

jobs:
  simulate:
    # Fork PRs don't see `secrets.EDGAR_USER_AGENT`. Any cache miss would fall
    # through to a live EDGAR fetch and 403 immediately. Skip cleanly instead
    # of failing — maintainers can re-run locally against the fork if needed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Warm-cache compute is ~10-15 min steady-state (per compute-rankings.yml
    # comment). PR #230 + #241 wired 5 skip env vars (FORM4_FETCH_SKIP +
    # QR_SKIP_TIER2 + QR_SKIP_FUNDAMENTALS + QR_SKIP_OSAP + QR_SKIP_CROSS_SOURCE)
    # to keep simulate under 45 min, but PRs #230 / #238 / #241 ALL still hit
    # the 45-min cap even after each round of skip-var additions. Bumped to
    # 90 min 2026-05-24 as a pragmatic backstop.
    #
    # Bumped again 90 -> 240 min (2026-06-13). Run #98 on this PR's branch
    # (job 81203525304, run 27471644445) was CANCELLED at the 90-min cap mid
    # per-stock write (`Wrote .../stocks/history/DOW.json` then
    # `##[error]The operation was canceled`). Root cause (NOT the timeout —
    # the timeout was the SYMPTOM): the cache restore MISSED
    # (`Cache not found for input keys: cache-v8-fast-2026Q2-Linux,
    # cache-v8-fast-2026Q2-, cache-v8-fast-`), so all 5 QR_SKIP_* escape
    # hatches fell through their documented "no cache -> live fetch" paths:
    # 502/502 tickers cold-fetched fundamentals (~20 min) + cold
    # fundamentals_history (2 live EDGAR round-trips per stock through the
    # writer phase, ~50 min) + a cold OSAP download (~10 min). A cache-MISS
    # 502-ticker run cannot finish in 90 min, and the S&P 900 pilot's first
    # cold run definitely cannot. The companion cache-restore fix below
    # (split into the cron's TWO bundles so the warm path actually restores)
    # keeps a HIT run ~15-25 min, but a PR-context cross-branch cache MISS is
    # inherent (GitHub scopes caches per branch; a fresh `main` save is not
    # always visible to a PR run — run #100's main cron saved
    # cache-v8-fast-2026Q2-Linux at 15:50 yet this PR run missed it 8 min
    # later), so the timeout is the must-have safety net regardless of cache.
    # Matches (≥) the weekly cron's `timeout-minutes` (raised in the #249 era
    # + Phase 7.0 folded backtest; bumped 240→270 for sp1500 scale, then
    # 270→420 for Phase 9.3 broad-investable-US scale — owner-authorised).
    # Phase 9.3 gate-C1 fix (2026-07-02): the cron's own ceiling came back
    # DOWN 420→360 (420 was above GitHub Actions' unmovable 6h/360-min
    # per-job hard cap — dead configuration; see compute-rankings.yml's
    # timeout comment). This sim job's 420 is left AS-IS (still comfortably
    # >= the cron's new 360, satisfying the guard below with wider margin);
    # lowering it to exactly match isn't required and isn't this PR's scope.
    # Simulate runs FEWER loops than the cron (5 skip vars + no committed
    # output + no PIT backtest), so 420 is an upper bound it should never
    # approach on a warm restore. Simulate IS informational-only (workflow
    # comment ~line 24) + restore-only, so the wider budget can never block a
    # PR merge or poison the canonical cache.
    # Guard: tests/test_workflow_cache_coverage.py::test_sim_timeout_at_least_cron_timeout
    # asserts sim_timeout >= cron_timeout — bump this in lockstep with the cron.
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same extras as compute-rankings.yml — compute/ingest/osap.py
          # imports `openassetpricing` from the `factors` extra.
          pip install -e ".[factors]"

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      # TWO restore steps mirroring the cron's TWO SAVE bundles (split
      # 2026-06-13). The cron (compute-rankings.yml) writes the fast bundle
      # under `cache-v8-fast-<q>-<os>` and the slow-text bundle under a
      # SEPARATE key `cache-v5-text-<os>-<run_id>`. The old single restore
      # here listed ALL 11 paths but keyed ONLY on `cache-v8-fast-...`, so
      # the 5 slow-text paths (edgar_10k_text / edgar_8k / edgar_amendments /
      # edgar_late_filings / osap) were NEVER restored — they live in a cache
      # this step never requested. That is why OSAP cold-downloaded on EVERY
      # sim even with QR_SKIP_OSAP=1 (its skip falls through to a live fetch
      # when the parquet is absent), and contributed to the run #98 90-min
      # cancellation. Splitting into the cron's two real keys lets BOTH
      # bundles restore warm. Paths + key families mirror compute-rankings.yml
      # EXACTLY — bump together (tests/test_workflow_cache_coverage.py guards
      # the fast key family via `sim_text`).
      #
      # `restore` only on BOTH — never save. We piggyback on the cache the
      # weekly cron writes from main; saving here would let a PR branch's
      # potentially-broken cache overwrite the canonical one. (That is also
      # why the slow-text restore uses restore-keys ONLY: the cron's save key
      # is run-id-unique, so the sim grabs the latest prior text snapshot by
      # the `cache-v5-text-<os>-` prefix, exactly as the cron itself does.)
      - name: Restore fast caches (fundamentals / prices / form4 — from weekly cron)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            compute/cache/fundamentals
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe-v2.parquet
            compute/cache/universe_sp400-v1.parquet
            compute/cache/universe_sp900-v1.parquet
            compute/cache/universe_sp600-v1.parquet
            compute/cache/universe_sp1500-v1.parquet
            compute/cache/yfinance_info
            compute/cache/edgar_form4
            compute/cache/broad_universe-v1.parquet
          key: cache-v12-fast-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v12-fast-${{ steps.quarter.outputs.q }}-
            cache-v12-fast-

      - name: Restore slow text caches (edgar_10k_text / edgar_8k / osap — from weekly cron)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            compute/cache/edgar_10k_text
            compute/cache/edgar_8k
            compute/cache/edgar_amendments
            compute/cache/edgar_late_filings
            compute/cache/osap
          # The cron SAVES this bundle under a run-id-unique key
          # (`cache-v5-text-<os>-<run_id>`); restore the most-recent prior
          # save by prefix. No exact `key:` here on purpose — there is no
          # stable key to exact-hit, and the sim never saves.
          key: cache-v5-text-${{ runner.os }}-restore-only
          restore-keys: |
            cache-v5-text-${{ runner.os }}-

      - name: Run PR-branch compute
        id: compute
        run: |
          start=$(date +%s)
          python -m compute.main
          end=$(date +%s)
          echo "duration_s=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Extract output metadata
        id: meta
        if: steps.compute.outcome == 'success'
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("frontend/public/data/metadata.json") as f:
              m = json.load(f)
          print(f"universe_size={m['universe_size']}")
          print(f"schema_version={m['version']}")
          print(f"git_commit={m['git_commit']}")
          PY

      # Diff vs main — PR 2 (Epic #125 Item 3). Both steps below are
      # `continue-on-error: true` so a missing baseline / parse failure
      # degrades the comment instead of failing the workflow.
      - name: Fetch main's committed compute output
        id: fetch_main
        if: steps.compute.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p /tmp/main-data
          git fetch origin main --depth=1
          # Write to .tmp first so a `git show` failure leaves no half-written
          # file behind (set -e bails after the redirect creates the empty file).
          git show origin/main:frontend/public/data/rankings.json > /tmp/main-data/rankings.json.tmp
          mv /tmp/main-data/rankings.json.tmp /tmp/main-data/rankings.json
          git show origin/main:frontend/public/data/metadata.json > /tmp/main-data/metadata.json.tmp
          mv /tmp/main-data/metadata.json.tmp /tmp/main-data/metadata.json

      - name: Compute diff vs main
        id: diff
        if: steps.fetch_main.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/pre_merge_diff.py \
            --pr-rankings frontend/public/data/rankings.json \
            --pr-metadata frontend/public/data/metadata.json \
            --main-rankings /tmp/main-data/rankings.json \
            --main-metadata /tmp/main-data/metadata.json \
            --output "$GITHUB_WORKSPACE/diff_output.md"

      - name: Upload PR-branch compute output
        if: steps.compute.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-${{ github.event.pull_request.number }}-compute-output
          path: frontend/public/data/
          # 14 days is enough for a PR's review window without
          # accumulating dead artifacts.
          retention-days: 14

      # `if: !cancelled()` — post on success OR compute failure, but not when a
      # newer push cancels this run. Failure-path comment is PR 2's contribution
      # (PR 1 fell through silently on red checks).
      - name: Post or update PR comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMPUTE_OUTCOME: ${{ steps.compute.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          DURATION_S: ${{ steps.compute.outputs.duration_s }}
          UNIVERSE_SIZE: ${{ steps.meta.outputs.universe_size }}
          SCHEMA_VERSION: ${{ steps.meta.outputs.schema_version }}
          GIT_COMMIT: ${{ steps.meta.outputs.git_commit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- pre-merge-prod-sim -->';

            let body;
            if (process.env.COMPUTE_OUTCOME !== 'success') {
              body = [
                marker,
                '## Pre-merge production simulation',
                '',
                `❌ Compute step failed — see [run log](${process.env.RUN_URL}).`,
                '',
                '_PR-branch compute did not produce output; diff vs main was skipped._',
              ].join('\n');
            } else {
              const artifactName = `pr-${process.env.PR_NUMBER}-compute-output`;
              const lines = [
                marker,
                '## Pre-merge production simulation',
                '',
                '| Field | Value |',
                '|---|---|',
                `| Duration | ${process.env.DURATION_S}s |`,
                `| Universe size | ${process.env.UNIVERSE_SIZE} |`,
                `| Schema version | \`${process.env.SCHEMA_VERSION}\` |`,
                `| Compute commit | \`${process.env.GIT_COMMIT}\` |`,
                `| PR-branch output | [\`${artifactName}\`](${process.env.RUN_URL}) (14-day retention) |`,
              ];

              if (process.env.DIFF_OUTCOME === 'success') {
                const diffPath = path.join(process.env.GITHUB_WORKSPACE, 'diff_output.md');
                if (fs.existsSync(diffPath)) {
                  lines.push(fs.readFileSync(diffPath, 'utf8'));
                }
              } else {
                lines.push('');
                lines.push('_Diff vs main unavailable — main checkout / diff step failed; see [run log](' + process.env.RUN_URL + ')._');
              }

              body = lines.join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
