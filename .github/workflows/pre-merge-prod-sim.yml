name: Pre-Merge Production Simulation

# Epic #125 Item 3 — close the gap between CI-green and provably-correct.
#
# CI (ci.yml) verifies that the code lints, the schema is consistent, and the
# unit tests pass. None of those catch a composite-score regression that only
# materialises against the full S&P 500 universe with real EDGAR data — the
# Phase 4h.2 Part 1 silent-drop (issue #116) was the forcing example.
#
# This workflow runs the weekly compute against the PR branch using the warm
# cache the weekly cron (`compute-rankings.yml`) leaves behind, then posts a
# sticky PR comment with:
#   - PR 1 (#140): duration, universe size, schema version, output artifact
#   - PR 2 (this file): composite-score diff vs main + top-10 movers table +
#     universe-size delta + failure-path comment on compute step failure.
#
# Baseline for the diff = main's COMMITTED `frontend/public/data/` (read via
# `git show origin/main:...`), not a fresh re-run on main. Rationale: the
# diff answers "did this PR change what production shows users?" — the right
# anchor is the last-committed main output, not a counterfactual fresh run.
# Free (no second compute), no doubled EDGAR rate-limit pressure.
#
# This check is intentionally NOT a required status — it's informational only,
# slow (~10-15 min warm), and unavailable on fork PRs (no secrets).

on:
  pull_request:
    paths:
      - "compute/scoring/**"
      - "compute/features/**"
      - "compute/ingest/**"
      - "compute/valuation/**"
      - "compute/output/schemas.py"
      - "compute/main.py"
      - "pyproject.toml"

# Latest push on a PR cancels any in-flight simulation for the same PR.
# A 15-min compute against a stale revision is dead weight.
concurrency:
  group: pre-merge-prod-sim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  # 2026-05-22 — pre-merge-prod-sim skips the Form-4 fetch loop.
  # The Form-4 cache is brand-new (introduced by PR-2, this same
  # branch's parent PR) and never populated by any prior cron, so
  # every sim run is cold-cache. 502 tickers × N filings × per-
  # filing HTTP = exceeds the 45-min CI cap. Form-4 is observability
  # ONLY (form4_enabled=False; _FORM4_FLAGS_ENABLED=False) → zero
  # scoring impact → the composite-score diff that this sim checks
  # is unaffected by skipping the fetch. Weekly cron (compute-
  # rankings.yml, default 360-min budget) still runs the full
  # fetch and populates the cache for future sims.
  FORM4_FETCH_SKIP: "1"
  # 2026-05-24 — pre-merge-prod-sim skips the Tier-2 (10-K text + 8-K)
  # fetch loop too. The Tier-2 loop is 502 tickers × (10-K full-text
  # download for going-concern phrase scan + 8-K filing list); cold-
  # cache cost is 20-35 min ALONE. Paired with fundamentals warm-up
  # (~10 min on partial cache hit), the budget breaches the 45-min
  # cap → cancelled at the deadline (e.g., PR #230 2026-05-24).
  # `QR_SKIP_TIER2` is the existing kill-switch wired in
  # `compute/scoring/tier2.py:158` since the module's introduction;
  # we just never set it here. Tradeoff: the simulate's composite-
  # score diff is unchanged (Tier-2 going_concern is annotate-only;
  # the non_reliance veto, enabled since PR 4g, is suppressed in
  # this run — acceptable because simulate is informational-only
  # and the veto logic is covered by offline pytest). Weekly cron
  # (compute-rankings.yml) does NOT set this — full Tier-2 still
  # runs there and populates the warm cache for future sims.
  QR_SKIP_TIER2: "1"
  # 2026-05-24 (PR #230 Part 4) — fundamentals freshness-gate skip.
  # The QR_SKIP_TIER2 fix above eliminated 20-35m of cold Tier-2
  # cost but simulate STILL cancelled at 45m. Root cause: even when
  # cached fundamentals parquets exist (restored from the weekly
  # cron), `compute/ingest/fundamentals.py:_is_fresh()` gates by
  # filing_date — any ticker whose latest SEC filing is >45 days
  # old (FUNDAMENTALS_REFETCH_DAYS=45) gets a live EDGAR re-fetch.
  # 502 tickers × ~8 workers vs SEC's 10 req/s ceiling = 25-50 min
  # alone, enough to fill the entire 45m budget. QR_SKIP_FUNDAMENTALS
  # forces use of the cached parquet without the freshness check.
  # SAFE for simulate because: (a) the diff compares PR-branch vs
  # main's COMMITTED rankings.json, both produced from the SAME
  # weekly-cron cache — using that cache without re-fetch is the
  # correct input, not a quality compromise; (b) falls through to
  # live fetch if no cache exists (cold runner has nothing to read).
  # Weekly cron (compute-rankings.yml) does NOT set this — full
  # fundamentals fetch runs there.
  QR_SKIP_FUNDAMENTALS: "1"
  # 2026-05-24 (PR #230 Part 5 follow-up) — pre-merge-prod-sim skips
  # the OSAP bulk fetch too. Parts 1-4 above killed three SEC EDGAR
  # loops (Form-4, Tier-2, fundamentals × 2) but left the 4th
  # external-data fetch — OSAP / openassetpricing.com — running
  # unconditionally. ci-triage-engineer session 6 root-cause: the
  # `compute/cache/osap/` directory was missing from BOTH workflow
  # cache `path:` blocks, so every simulate started with an EMPTY
  # OSAP cache. `fetch_osap_returns` then hits a 30-second to
  # 45-minute live download from openassetpricing.com (single host,
  # no SLA, tenacity 2-attempt × 30s stop_after_delay). When this
  # was combined with any small fundamentals fall-through or
  # cache-restore partial miss it pushed simulate past the 45-min
  # cap on PR #238 (`cdf70bd`). Fix is two-part: (a) add
  # `compute/cache/osap` to BOTH workflow cache paths below + in
  # compute-rankings.yml (so weekly cron populates the warm cache);
  # (b) wire `QR_SKIP_OSAP=1` here as the defense-in-depth backstop
  # for cache-evicted scenarios. Weekly cron does NOT set this —
  # full live fetch runs there once a week.
  QR_SKIP_OSAP: "1"
  # 2026-05-24 (PR #230 Part 6 — the 5th loop) — pre-merge-prod-sim
  # also skips the cross-source yfinance.info validation loop. Even
  # with the four prior skip vars (FORM4_FETCH_SKIP + QR_SKIP_TIER2 +
  # QR_SKIP_FUNDAMENTALS + QR_SKIP_OSAP) ALL set + `compute/cache/yfinance_info`
  # already in the workflow cache `path:` block, the simulate STILL
  # cancelled at 45m14s on PR #241. Root cause: yfinance_info has a
  # 24-hour freshness TTL in `_cache_read`. The weekly cron writes
  # the cache Friday 22:00 UTC, but a Sunday simulate's cache restore
  # gives 39-hour-old entries → fails freshness check → 502-ticker
  # serial `yf.Ticker(ticker).info` cold fetch (2-8s per ticker with
  # tenacity `wait_exponential(min=1, max=10)` × 3 attempts) = 17-67
  # minutes alone. ci-triage-engineer session-6 root-cause from
  # exhaustive code walk of compute/main.py's external-data loops.
  # Wired in `compute/ingest/cross_source.py:fetch_yfinance_market_cap`
  # at the TOP of the function: when set, stale-but-present cache
  # entries are read directly (bypassing the 24h TTL); when cache
  # is genuinely empty, returns None (skip the cross-source check
  # entirely — semantically identical to a cold-cache fetch failure
  # which the call site already handles).
  QR_SKIP_CROSS_SOURCE: "1"

permissions:
  contents: read
  pull-requests: write

jobs:
  simulate:
    # Fork PRs don't see `secrets.EDGAR_USER_AGENT`. Any cache miss would fall
    # through to a live EDGAR fetch and 403 immediately. Skip cleanly instead
    # of failing — maintainers can re-run locally against the fork if needed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Warm-cache compute is ~10-15 min steady-state (per compute-rankings.yml
    # comment). PR #230 + #241 wired 5 skip env vars (FORM4_FETCH_SKIP +
    # QR_SKIP_TIER2 + QR_SKIP_FUNDAMENTALS + QR_SKIP_OSAP + QR_SKIP_CROSS_SOURCE)
    # to keep simulate under 45 min, but PRs #230 / #238 / #241 ALL still hit
    # the 45-min cap even after each round of skip-var additions. Bumped to
    # 90 min 2026-05-24 as a pragmatic backstop — if the cache restore from
    # the weekly cron is empty/partial (cache eviction OR cron didn't run OR
    # the new path additions invalidated the key), the live fetch fallbacks
    # need more headroom. Cron uses 150 min; simulate at 90 stays well below
    # that. Simulate IS informational-only per the workflow comment at line
    # 24, so the workflow can afford a wider budget without blocking PR
    # merge.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same extras as compute-rankings.yml — compute/ingest/osap.py
          # imports `openassetpricing` from the `factors` extra.
          pip install -e ".[factors]"

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      - name: Restore compute caches (from weekly cron)
        # `restore` only — never save. We're piggybacking on the cache the
        # weekly cron writes from main; saving here would let a PR branch's
        # potentially-broken cache overwrite the canonical one.
        # Keys + paths mirror compute-rankings.yml; bump together if either
        # changes.
        uses: actions/cache/restore@v5
        with:
          path: |
            compute/cache/fundamentals
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe-v2.parquet
            compute/cache/edgar_8k
            compute/cache/edgar_10k_text
            compute/cache/yfinance_info
            compute/cache/edgar_amendments
            compute/cache/edgar_late_filings
            compute/cache/edgar_form4
            compute/cache/osap
          key: cache-v8-fast-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v8-fast-${{ steps.quarter.outputs.q }}-
            cache-v8-fast-

      - name: Run PR-branch compute
        id: compute
        run: |
          start=$(date +%s)
          python -m compute.main
          end=$(date +%s)
          echo "duration_s=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Extract output metadata
        id: meta
        if: steps.compute.outcome == 'success'
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("frontend/public/data/metadata.json") as f:
              m = json.load(f)
          print(f"universe_size={m['universe_size']}")
          print(f"schema_version={m['version']}")
          print(f"git_commit={m['git_commit']}")
          PY

      # Diff vs main — PR 2 (Epic #125 Item 3). Both steps below are
      # `continue-on-error: true` so a missing baseline / parse failure
      # degrades the comment instead of failing the workflow.
      - name: Fetch main's committed compute output
        id: fetch_main
        if: steps.compute.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p /tmp/main-data
          git fetch origin main --depth=1
          # Write to .tmp first so a `git show` failure leaves no half-written
          # file behind (set -e bails after the redirect creates the empty file).
          git show origin/main:frontend/public/data/rankings.json > /tmp/main-data/rankings.json.tmp
          mv /tmp/main-data/rankings.json.tmp /tmp/main-data/rankings.json
          git show origin/main:frontend/public/data/metadata.json > /tmp/main-data/metadata.json.tmp
          mv /tmp/main-data/metadata.json.tmp /tmp/main-data/metadata.json

      - name: Compute diff vs main
        id: diff
        if: steps.fetch_main.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/pre_merge_diff.py \
            --pr-rankings frontend/public/data/rankings.json \
            --pr-metadata frontend/public/data/metadata.json \
            --main-rankings /tmp/main-data/rankings.json \
            --main-metadata /tmp/main-data/metadata.json \
            --output "$GITHUB_WORKSPACE/diff_output.md"

      - name: Upload PR-branch compute output
        if: steps.compute.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-compute-output
          path: frontend/public/data/
          # 14 days is enough for a PR's review window without
          # accumulating dead artifacts.
          retention-days: 14

      # `if: !cancelled()` — post on success OR compute failure, but not when a
      # newer push cancels this run. Failure-path comment is PR 2's contribution
      # (PR 1 fell through silently on red checks).
      - name: Post or update PR comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          COMPUTE_OUTCOME: ${{ steps.compute.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          DURATION_S: ${{ steps.compute.outputs.duration_s }}
          UNIVERSE_SIZE: ${{ steps.meta.outputs.universe_size }}
          SCHEMA_VERSION: ${{ steps.meta.outputs.schema_version }}
          GIT_COMMIT: ${{ steps.meta.outputs.git_commit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- pre-merge-prod-sim -->';

            let body;
            if (process.env.COMPUTE_OUTCOME !== 'success') {
              body = [
                marker,
                '## Pre-merge production simulation',
                '',
                `❌ Compute step failed — see [run log](${process.env.RUN_URL}).`,
                '',
                '_PR-branch compute did not produce output; diff vs main was skipped._',
              ].join('\n');
            } else {
              const artifactName = `pr-${process.env.PR_NUMBER}-compute-output`;
              const lines = [
                marker,
                '## Pre-merge production simulation',
                '',
                '| Field | Value |',
                '|---|---|',
                `| Duration | ${process.env.DURATION_S}s |`,
                `| Universe size | ${process.env.UNIVERSE_SIZE} |`,
                `| Schema version | \`${process.env.SCHEMA_VERSION}\` |`,
                `| Compute commit | \`${process.env.GIT_COMMIT}\` |`,
                `| PR-branch output | [\`${artifactName}\`](${process.env.RUN_URL}) (14-day retention) |`,
              ];

              if (process.env.DIFF_OUTCOME === 'success') {
                const diffPath = path.join(process.env.GITHUB_WORKSPACE, 'diff_output.md');
                if (fs.existsSync(diffPath)) {
                  lines.push(fs.readFileSync(diffPath, 'utf8'));
                }
              } else {
                lines.push('');
                lines.push('_Diff vs main unavailable — main checkout / diff step failed; see [run log](' + process.env.RUN_URL + ')._');
              }

              body = lines.join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
