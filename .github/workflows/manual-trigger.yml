name: Manual Trigger

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to log for this ad-hoc run"
        required: false
        default: "ad-hoc debug run"

permissions:
  contents: read

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Echo run context
        run: |
          echo "Note: ${{ inputs.note }}"
          echo "Ref: ${{ github.ref }}"
          echo "Phase 0 stub — wire up real ad-hoc tasks in later phases."
