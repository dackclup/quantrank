name: Manual Trigger

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to log for this ad-hoc run"
        required: false
        default: "ad-hoc debug run"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      # No deps install — this Phase-0 stub only echoes run context. Restore
      # actions/checkout + setup-python + `pip install` when it does real work.
      - name: Echo run context
        env:
          NOTE: ${{ inputs.note }}
        run: |
          echo "Note: $NOTE"
          echo "Ref: ${{ github.ref }}"
          echo "Phase 0 stub — wire up real ad-hoc tasks in later phases."
