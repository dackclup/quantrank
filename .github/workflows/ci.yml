name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded in-progress run on a new push to the SAME PR ref, so
# rapid re-pushes don't stack multiple ~20-min Python runs. Never cancel a
# `main`-push run (post-merge verification must always complete).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Skip the ~20-min pytest on PRs that change no Python-relevant paths
      # (docs-only / frontend-only). The job ALWAYS runs so the required check
      # still reports green; only the heavy Pytest step is gated. ruff + the
      # doc/model/schema guards keep running (cheap, and the doc-test-count
      # guard must run precisely when docs change). Always-on for `main` push.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - 'compute/**'
              - 'tests/**'
              - 'tools/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,factors]"
      - name: Ruff
        run: ruff check .
      - name: Doc test-count drift guard
        run: python tools/check_doc_test_counts.py
      - name: Subagent model-pin guard
        run: python tools/check_model_pin.py
      - name: Agent/hook/flow consistency guard
        run: python tools/check_agent_hook_consistency.py
      - name: Defense-layer count guard
        run: python tools/check_defense_layer_counts.py
      - name: Schema snapshot guard
        run: python -m compute.output.schema_check
      - name: Pytest
        if: github.ref == 'refs/heads/main' || steps.changes.outputs.code == 'true'
        run: pytest -q
      - name: Pytest skipped (no Python-relevant changes)
        if: github.ref != 'refs/heads/main' && steps.changes.outputs.code != 'true'
        run: echo "No compute/tests/tools/pyproject changes in this PR — skipping pytest."

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Skip the npm build on PRs that touch no frontend paths. Job always
      # runs (required check stays green); only the build steps are gated.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            fe:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: github.ref == 'refs/heads/main' || steps.changes.outputs.fe == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: github.ref == 'refs/heads/main' || steps.changes.outputs.fe == 'true'
        run: npm ci --no-audit --no-fund
      # Lint gate (added after the Next 16 / ESLint 9 flat-config migration in
      # PR #656). `tsc` + `next build` do NOT run eslint, so lint regressions —
      # including the react-hooks rules eslint-config-next@16 newly enforces —
      # were previously invisible to CI. `eslint .` fails on errors (warnings
      # do not gate).
      - name: Lint (eslint)
        if: github.ref == 'refs/heads/main' || steps.changes.outputs.fe == 'true'
        run: npm run lint
      - name: Unit tests (vitest)
        if: github.ref == 'refs/heads/main' || steps.changes.outputs.fe == 'true'
        run: npm run test:unit
      - name: Build (static export)
        if: github.ref == 'refs/heads/main' || steps.changes.outputs.fe == 'true'
        run: npm run build
      - name: Frontend skipped (no frontend changes)
        if: github.ref != 'refs/heads/main' && steps.changes.outputs.fe != 'true'
        run: echo "No frontend/** changes in this PR — skipping vitest + build."
