name: Compute Rankings

on:
  schedule:
    # Mon-Fri 22:00 UTC = 18:00 EDT — runs ~2h after US market close (16:00 EDT)
    # so EOD prices have settled. Weekends skipped (no new trading data).
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  # Form-4 bulk fetch RUNS on the cron (observability-only —
  # form4_enabled=False → ZERO scoring impact; it accumulates the
  # form4_* Metadata surface toward the 2026-08-19 Q3 cohort audit).
  # The 2026-05-25 emergency FORM4_FETCH_SKIP=1 was reverted here
  # (Issue #287 PR B) once the durable cron-time fixes landed — PR #297
  # (timeout rebaseline + cache-restore canary + per-loop wall-clocks)
  # and PR #427 (tier2 cache split). Validated on cron run #87 (15m49s
  # warm, tier2 11.2s — ample headroom for Form-4's ~2-3m). The
  # escape-hatch var stays set on pre-merge-prod-sim.yml ONLY (45-min cap).

# Default to read for the workflow; the `compute` job explicitly elevates
# to `contents: write` because its final step `git commit + push`-es the
# generated JSON back to main. Any future job added to this file
# inherits the read default unless it explicitly opts up — least-
# privilege per security-reviewer 2026-05-23 (PR #226 WARN W2).
permissions:
  contents: read

jobs:
  # Trading-day gate (2026-06-06): the schedule fires Mon-Fri, but ~9-10 of
  # those weekdays are NYSE full-day holidays where the market is closed and the
  # compute would only recommit a timestamp-bumped no-op (the folded backtest's
  # `generated_utc` always moves). This tiny job (stdlib only — no checkout, no
  # pip install, ~15s) short-circuits those scheduled runs. SAFE BY DESIGN: the
  # default is "run" — only an explicitly-listed holiday sets run=false, and any
  # error fails OPEN (run=true), so a stale/missing list degrades to a harmless
  # no-op run, NEVER a skipped real trading day. A manual `workflow_dispatch`
  # bypasses the gate entirely (see the `compute` job `if:`), so a forced regen
  # on a holiday / after a fix still works.
  trading-day-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is today a US trading day?
        id: check
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          # NYSE full-day closures (observed weekday dates). UPDATE every year or
          # two — an out-of-date / missing entry just lets that holiday run as a
          # harmless no-op (the compute finds no new market data); it can NEVER
          # skip a real trading day because the default is "run". Half-days (1pm
          # closes before Jul 4 / after Thanksgiving / Christmas Eve) are NOT
          # listed — the market traded, so we want those runs.
          NYSE_HOLIDAYS = {
              # 2026
              "2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
              "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25",
              # 2027
              "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
              "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24",
              # 2028
              "2028-01-17", "2028-02-21", "2028-04-14", "2028-05-29", "2028-06-19",
              "2028-07-04", "2028-09-04", "2028-11-23", "2028-12-25",
          }
          try:
              from zoneinfo import ZoneInfo
              et = datetime.now(ZoneInfo("America/New_York")).date()
              run = et.weekday() < 5 and et.isoformat() not in NYSE_HOLIDAYS
              why = "TRADING DAY -> run compute" if run else "market closed (weekend/NYSE holiday) -> skip"
              print(f"ET date {et} (weekday={et.weekday() < 5}): {why}")
          except Exception as exc:  # tzdata missing / any error -> fail OPEN
              run = True
              print(f"gate check errored ({exc!r}) -> fail-open, running compute")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          PY

  compute:
    needs: trading-day-gate
    # Run when the gate says it's a trading day. A manual workflow_dispatch
    # always proceeds (force a regen after a fix / on a holiday). FAIL-OPEN: if
    # the gate JOB itself errored (infra) we still run (`result == 'failure'`),
    # so the gate can never cause a real trading day to be missed; `!cancelled()`
    # is required for this `if` to evaluate at all after a failed `needs`. On a
    # genuine holiday skip the whole compute job — incl. the folded backtest +
    # the commit — is bypassed, so no timestamp-only no-op commit lands.
    if: ${{ !cancelled() && (needs.trading-day-gate.outputs.run == 'true' || needs.trading-day-gate.result == 'failure' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # The `Commit JSON outputs` step at the end of this job is the only
    # writer in the workflow; scope the elevated permission to this job
    # so the workflow-level default stays read.
    permissions:
      contents: write
    # Per-loop cold-cache budget (5 SEC EDGAR loops as of Phase 4.5e PR #205):
    #   Step 1  prices (yfinance)         ~2-5 min   cold / ~1-2 min warm
    #   Step 2  fundamentals snapshot     ~15-25 min cold / ~0 min warm (cache hit)
    #   Step 3  annual fundamentals hist  ~10-15 min cold / ~0 min warm
    #   Step 4  Form-4 fetch (EDGAR)      ~7-10 min  cold / ~2-3 min warm
    #   Step 4b Tier-2 (10-K + 8-K)       ~20-35 min cold / ~3-5 min warm
    #   OSAP download                     ~2-5 min   cold / ~0.5 min warm
    #   Cross-source yfinance.info        warm-cache only in cron (24h TTL)
    #   Scoring + JSON writes             ~2-3 min
    #
    # Worst-case fully-cold (5 EDGAR loops evicted):    ~100-115 min
    # +20% SEC throttle spike:                          ~120-140 min
    # +Commit step + GitHub runner spin-up + headroom:  ~195m ceiling
    #
    # History:
    # - Phase 3d Part 2: 90m (4-loop reality, warm-cache wall-clock 5m14s)
    # - Phase 4g: 150m (re-enabled 8-K Tier-2, +15-30m)
    # - Phase 4.5e PR #205 (2026-05-22): added Form-4 as 5th EDGAR loop
    #   without bumping the budget → cron cancelled at 150m on 2026-05-25
    #   00:13 UTC after a 44h Fri→Sun cache eviction (incident-commander
    #   session 8 verdict).
    # - Issue #287 PR A (2026-05-28): rebaseline to 195m + cache-restore
    #   canary (surfaces cache eviction in ~30s) + per-loop wall-clock
    #   Metadata observability. Budget: 195m × 5 weekday runs × 4 weeks =
    #   3,900 GitHub Actions minutes/month (~$15 over the 2,000-min free
    #   tier on the paid plan).
    # - Phase 7.0 follow-up (2026-06-06): folded the PIT portfolio backtest
    #   into the cron as a warm step so the AI-pick home page refreshes weekly
    #   without a manual dispatch. The backfill runs AFTER the compute step in
    #   the same job, so it inherits the working-dir caches the compute just
    #   warmed → ~35-45m at the 10Y window (was ~15-20m at 5Y; PR #440 extended
    #   the backtest 5y → 10y, ~doubling the distinct picks 64 → 134, so the
    #   per-pick live-EDGAR amendment fetches the backfill does NOT cache-share
    #   with the compute step grew ~5m → ~10m, atop ~30m PIT scoring). NOT the
    #   ~60m fully-cold budget the standalone backfill-portfolio.yml carries: the
    #   compute step pre-warms the current-universe prices + fundamentals_history
    #   on disk first, and the 214 historical-only ledger members are SKIPPED
    #   (never fetched — backfill pre-loads only the current universe). Capped at
    #   55m + continue-on-error so it can never block the rankings commit (cap was
    #   40m through 2026-06-08; the 10Y warm runtime left only ~5-10m headroom and
    #   a slow-SEC day could kill the step — a kill is benign: the atomic writer
    #   keeps the prior backtest_pit.json and the rankings commit still lands, but
    #   the backtest as_of would stall ~1 week). Job ceiling raised 195 → 225 →
    #   240 to preserve headroom over a worst-case cold compute (~140-160m) PLUS
    #   the capped backtest step. Cost: warm steady-state adds ~35-45m/run;
    #   worst-case monthly ceiling is now 240m × 5 weekday runs × 4 weeks = 4,800
    #   GitHub Actions minutes/month.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Phase 4h: weekly compute imports compute/ingest/osap.py which
          # imports the `openassetpricing` package — installed via the
          # `factors` extra (pinned to ==0.0.2 in pyproject.toml).
          pip install -e ".[factors]"

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      # Two INDEPENDENT caches (split 2026-06-06, edgar-debugger root-cause of
      # the tier2-cold-every-run bug). The old SINGLE 11-path bundle (~250-500
      # MB) was too large to reliably save in the post-job window once the job
      # ran 100-180m; the save truncated and the largest layers (edgar_10k_text
      # ~50-150 MB, edgar_8k) never persisted, so the next run restored an older
      # bundle WITHOUT them -> Tier-2 ran cold (~80m full SEC re-fetch) ->
      # runtime climbed -> the next save failed again: a self-reinforcing
      # cold-cache trap (cron #82: fundamentals warm p95=11.3s but
      # tier2_wall_clock=4836s = 80.6m). Splitting into two independently-saved
      # caches means losing one never loses the other.

      # FAST-changing bundle — per-quarter key (unchanged: fundamentals is proven
      # warm under this key, so don't touch what works; fundamentals freshness is
      # handled by `_is_fresh()` refetch-by-filing-date). Bump the v on a
      # cache-schema or live-fetch-only value-correctness change:
      #   v4 (PR 4c.1): `_ANNUAL_TAGS` += stockholders_equity
      #   v5 (Issue #288): GOOG/GOOGL per-class XBRL share-override path
      #   -> bump to v6 next time either trigger fires.
      - name: Restore fast caches (fundamentals / prices / form4)
        uses: actions/cache@v5
        with:
          path: |
            compute/cache/fundamentals
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe-v2.parquet
            compute/cache/yfinance_info
            compute/cache/edgar_form4
          key: cache-v6-fast-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v6-fast-${{ steps.quarter.outputs.q }}-
            cache-v6-fast-

      # SLOW-changing text bundle — RUN-ID key + prefix restore-keys (the textbook
      # "keep a cache fresh AND persistent" idiom). A unique key per run means the
      # post-job save is NEVER skipped by actions/cache immutability, so THIS
      # run's freshly-fetched 10-K/8-K text always persists; the `restore-keys`
      # prefix restores the most-recent prior good save. This fixes the actual
      # failure (text never persisting) AND avoids both the static-key 90-day
      # cliff (frozen 10-K cache aging past its TTL with no re-save) and the
      # quarter-rollover cold run. Smaller bundle (no fundamentals weight) also
      # saves more reliably. Bump to text-v6 on a cache-schema change.
      - name: Restore slow text caches (edgar_10k_text / edgar_8k / osap)
        uses: actions/cache@v5
        with:
          path: |
            compute/cache/edgar_10k_text
            compute/cache/edgar_8k
            compute/cache/edgar_amendments
            compute/cache/edgar_late_filings
            compute/cache/osap
          key: cache-v5-text-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cache-v5-text-${{ runner.os }}-

      - name: Cache restore canary (Issue #287 PR A)
        # Emits size (MB) + age (hours since newest file) for each of the
        # 10 cache layers BEFORE any SEC fetch begins. Goal: surface cache
        # eviction (→ cold run) in ~30 seconds rather than after 150-195m
        # of SEC polling. A size of 0 MB or `age=empty` means that
        # directory was not restored and the upcoming fetch will be fully
        # cold for that loop. Expected steady-state warm sizes (empirical):
        #   fundamentals/           ~80-120 MB   (502 parquets)
        #   fundamentals_history/   ~40-60 MB    (502 parquets)
        #   prices/                 ~20-40 MB    (502 parquets)
        #   edgar_8k/               ~10-30 MB
        #   edgar_10k_text/         ~50-150 MB   (lazy: ~80% present)
        #   yfinance_info/          ~5-20 MB
        #   edgar_amendments/       ~2-10 MB
        #   edgar_late_filings/     ~1-5 MB
        #   edgar_form4/            ~5-15 MB     (502 dirs)
        #   osap/                   ~1-5 MB      (parquet)
        # `bc` + GNU `find -printf` are standard on ubuntu-latest runners.
        # Fails-open if `bc` is missing — size still prints.
        run: |
          echo "=== Cache restore canary (Issue #287) ==="
          for dir in \
            compute/cache/fundamentals \
            compute/cache/fundamentals_history \
            compute/cache/prices \
            compute/cache/edgar_8k \
            compute/cache/edgar_10k_text \
            compute/cache/yfinance_info \
            compute/cache/edgar_amendments \
            compute/cache/edgar_late_filings \
            compute/cache/edgar_form4 \
            compute/cache/osap; do
            if [ -d "$dir" ]; then
              size_mb=$(du -sm "$dir" 2>/dev/null | cut -f1)
              newest=$(find "$dir" -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)
              if [ -n "$newest" ]; then
                age_h=$(echo "scale=1; ($(date +%s) - ${newest%.*}) / 3600" | bc 2>/dev/null || echo "?")
              else
                age_h="empty"
              fi
              echo "  $dir: ${size_mb}MB, age=${age_h}h"
            else
              echo "  $dir: MISSING (cold — not in restored cache)"
            fi
          done
          echo "=== End canary ==="

      - name: Run weekly compute
        run: python -m compute.main

      # Per-stage timing into the Actions run Summary tab — answers "which stage
      # is slow?" at a glance (e.g. surfaces tier2 at 80m so the cache fix is
      # visibly confirmed when it drops to ~5m next run). `if: always()` so a
      # compute abort still prints what ran. Reads the wall-clock fields compute
      # already writes to metadata.json; prices/fundamentals/scoring/JSON-write
      # timing land in a follow-up PR (need new wall-clock hooks + schema bump).
      - name: Stage timing summary (per-stage wall-clock)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("frontend/public/data/metadata.json")
          if not p.exists():
              print("metadata.json not found — compute did not reach the JSON write.")
              raise SystemExit(0)
          m = json.loads(p.read_text())
          def fmt(v):
              return f"{v/60:.1f} min ({v:.0f}s)" if isinstance(v, (int, float)) else "— (skipped / not reached)"
          def flag(v):
              if not isinstance(v, (int, float)):
                  return "skip"
              return "SLOW" if v > 600 else "ok"
          rows = [
              ("tier2 (10-K + 8-K)", m.get("tier2_wall_clock_seconds")),
              ("Step 8 (cross-source + ensemble + writes)", m.get("cross_source_wall_clock_seconds")),
              ("OSAP", m.get("osap_wall_clock_seconds")),
              ("Form-4", m.get("form4_wall_clock_seconds")),
          ]
          lines = ["## Compute stage timing", "", "| Stage | Status | Wall-clock |", "|---|---|---|"]
          for name, v in rows:
              lines.append(f"| {name} | {flag(v)} | {fmt(v)} |")
          lines += [
              "",
              f"_coverage: fundamentals {m.get('fundamentals_coverage_pct')}% · "
              f"tier2 {m.get('tier2_coverage_pct')}% · fundamentals p95 "
              f"{m.get('fundamentals_latency_p95_seconds')}s_",
              "",
              "_SLOW = stage > 10 min. prices / fundamentals / scoring / JSON-write "
              "timing: follow-up PR._",
          ]
          out = "\n".join(lines)
          print(out)
          sp = os.environ.get("GITHUB_STEP_SUMMARY")
          if sp:
              with open(sp, "a") as fh:
                  fh.write(out + "\n")
          PY

      - name: Refresh portfolio backtest (PIT) — warm caches from the compute step
        # Phase 7.0 follow-up (CLAUDE.md §Next deliverables item b): fold the
        # point-in-time AI-pick backtest into the cron so the home page's NAV +
        # Current picks + Rotation-history stay current weekly instead of needing
        # a manual backfill-portfolio.yml dispatch. It reuses the SAME prices +
        # fundamentals_history + benchmarks.json the compute step just refreshed
        # (warm ~15-20m), and the "Commit JSON outputs" step below already
        # git-adds frontend/public/data/ so backtest_pit.json commits alongside
        # the rankings. The weekly cron is the established SOLE trusted writer to
        # main, so this stays inside the existing trusted write path; the manual
        # backfill-portfolio.yml keeps its `if: ref != main` guard (security-
        # reviewer 2026-06-05) — we are NOT weakening that, only widening what the
        # already-trusted cron commits.
        #
        # continue-on-error + a 55m step cap so a backtest stall / failure can
        # NEVER block the rankings commit: the writer is atomic (tmp + os.replace),
        # so a failed run leaves the prior backtest_pit.json intact and the cron
        # still commits the fresh rankings. FORM4_FETCH_SKIP is irrelevant here —
        # the backfill's veto set is the 7 active rank-gates, none Form-4.
        continue-on-error: true
        timeout-minutes: 55
        run: python -m scripts.backfill_portfolio_pit

      - name: Show backtest meta (canary)
        # Per-run visibility that the folded backtest refresh actually completed.
        # The backfill step is continue-on-error, so without this a silent kill /
        # failure would leave no signal in the cron log. Mirrors the canary in
        # backfill-portfolio.yml. `generated_utc` is the tell: if it is THIS run's
        # timestamp the refresh landed; if it is stale the backfill was killed at
        # the 40m cap and the prior (atomic) artifact is what will be committed.
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("frontend/public/data/portfolio/backtest_pit.json")
          if p.exists():
              meta = json.loads(p.read_text()).get("meta", {})
              for k in ("generated_utc", "as_of_end", "rebalance_count",
                        "restatement_contamination_pct"):
                  print(f"  {k}: {meta.get(k)}")
          else:
              print("  backtest_pit.json NOT present")
          PY

      - name: Commit JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: update rankings $(date -u +%Y-%m-%d)"
            # Compute can take 30-50 min; during that window other PRs can
            # land on main (docs PRs, hotfixes). Rebase-then-push so the
            # bot commit cleanly stacks on top of whatever moved. Without
            # this, workflow #30 (2026-05-14) failed: push rejected because
            # main had advanced by 2 docs PRs during the 52-min compute.
            # The bot commit only touches `frontend/public/data/` so it
            # never conflicts with code/docs changes — rebase is safe.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $attempt failed; refetching and retrying."
              sleep $((attempt * 5))
            done
          fi
