name: Compute Rankings

on:
  schedule:
    - cron: "0 22 * * 0"  # Sunday 22:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      - name: Restore fundamentals cache
        uses: actions/cache@v5
        with:
          path: compute/cache/fundamentals
          # Cache version bumped to v2 after audit #6 deep-clean fixes the
          # ingest schema (TTM flow items, smart shares fallback, expanded
          # revenue / NI chains). Pre-v2 cached parquets hold wrong values
          # for AVB / NVDA / META / GS / WFC / BKNG / DUK etc. — the 45-day
          # `_is_fresh` check passes against the old (corrupted) filing
          # date, so without a key bump the workflow keeps reusing them.
          # Bump this when `_BALANCE_TAGS` / `_TTM_REVENUE_TAGS` /
          # `_TTM_NET_INCOME_TAGS` / `_TTM_FLOW_TAGS` change schema.
          key: fundamentals-v2-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            fundamentals-v2-${{ steps.quarter.outputs.q }}-
            fundamentals-v2-

      - name: Run weekly compute
        run: python -m compute.main

      - name: Commit JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: update rankings $(date -u +%Y-%m-%d)"
            git push
          fi
