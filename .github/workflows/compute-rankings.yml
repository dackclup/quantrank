name: Compute Rankings

on:
  schedule:
    # Mon-Fri 22:00 UTC = 18:00 EDT — runs ~2h after US market close (16:00 EDT)
    # so EOD prices have settled. Weekends skipped (no new trading data).
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

# Default to read for the workflow; the `compute` job explicitly elevates
# to `contents: write` because its final step `git commit + push`-es the
# generated JSON back to main. Any future job added to this file
# inherits the read default unless it explicitly opts up — least-
# privilege per security-reviewer 2026-05-23 (PR #226 WARN W2).
permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    # The `Commit JSON outputs` step at the end of this job is the only
    # writer in the workflow; scope the elevated permission to this job
    # so the workflow-level default stays read.
    permissions:
      contents: write
    # 90m was set after PR 3d Part 2 (per-stock latency observability)
    # and held through 4f (warm-cache wall-clock 5m14s). 4g re-enabled
    # 8-K Tier-2 fetches (Items 4.01 + 4.02), which added ~15-30m of
    # EDGAR work per cold-ish run. Two consecutive workflow_dispatch
    # runs (#43 manual, #44 scheduled) hit the 90m ceiling at the
    # "Commit JSON outputs" step — compute completed but couldn't
    # commit. Bump to 150m to give a ~60m buffer over the observed
    # ~85-90m ceiling without inflating GitHub Actions minute usage
    # (worst-case 150m × 4 weekly compute runs/month = 600 min,
    # comfortably under the 2000 min free-tier ceiling).
    #
    # Permanent fix is PR 4b §1 (cross-source validator + EDGAR
    # health probe) + the off-cycle pre-cache workflow drafted in
    # issue #15 — both will let weekly compute read warm 8-K
    # extracts from a side workflow instead of fetching live each
    # week. Until those land, the 150m ceiling is the cheap
    # mitigation.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Phase 4h: weekly compute imports compute/ingest/osap.py which
          # imports the `openassetpricing` package — installed via the
          # `factors` extra (pinned to ==0.0.2 in pyproject.toml).
          pip install -e ".[factors]"

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      - name: Restore compute caches (PR 4a — multi-path)
        uses: actions/cache@v5
        with:
          # PR 4a (workflow-cache-improvements/PLAN.md): six cache layers
          # exist in code (fundamentals, fundamentals_history, prices,
          # universe, edgar_8k, edgar_10k_text) but only `fundamentals`
          # was restored across CI runs. Each missing path forced a cold
          # re-fetch every weekly run — 10-K text alone hit ~5-15 min for
          # going-concern + ~2-3 min for yfinance OHLCV prices. With all
          # six restored, steady-state weekly compute drops from ~25-30
          # min to ~10-15 min.
          #
          # Cache key bumped to `cache-v4` (PR 4c.1) after PR 4c (issue #11)
          # extended `_ANNUAL_TAGS` with `stockholders_equity`. The cached
          # `fundamentals_history` parquets from the v3 era pre-date the
          # schema change — they lack the new column entirely, so the
          # per-year ROE path in `_avg_3y_roe` silently falls back to the
          # legacy single-period denominator. Forcing fresh fetch via key
          # bump is the established pattern (precedent: PR #49 bumped v1 →
          # v2 after the audit-#6 `_TTM_*` ingest expansion). Bump again to
          # v5 if any cache directory's *schema* changes (parquet column
          # rename, JSON shape change, new annual / TTM tag added). Value
          # drift is handled by per-cache `_is_fresh()` checks in
          # compute/ingest/*.py — those run regardless of key.
          path: |
            compute/cache/fundamentals
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe-v2.parquet
            compute/cache/edgar_8k
            compute/cache/edgar_10k_text
            compute/cache/yfinance_info
            compute/cache/edgar_amendments
            compute/cache/edgar_late_filings
            compute/cache/edgar_form4
          key: cache-v4-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v4-${{ steps.quarter.outputs.q }}-
            cache-v4-

      - name: Run weekly compute
        run: python -m compute.main

      - name: Commit JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: update rankings $(date -u +%Y-%m-%d)"
            # Compute can take 30-50 min; during that window other PRs can
            # land on main (docs PRs, hotfixes). Rebase-then-push so the
            # bot commit cleanly stacks on top of whatever moved. Without
            # this, workflow #30 (2026-05-14) failed: push rejected because
            # main had advanced by 2 docs PRs during the 52-min compute.
            # The bot commit only touches `frontend/public/data/` so it
            # never conflicts with code/docs changes — rebase is safe.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $attempt failed; refetching and retrying."
              sleep $((attempt * 5))
            done
          fi
