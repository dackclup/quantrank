name: Compute Rankings

on:
  schedule:
    # Mon-Fri 22:00 UTC = 18:00 EDT — runs ~2h after US market close (16:00 EDT)
    # so EOD prices have settled. Weekends skipped (no new trading data).
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe to rank. sp1500 = full S&P 1500 (~1500 names: sp500 + sp400 midcap + sp600 small-cap; Slice 7 cron-default flip 2026-06-20, mirrors #492 sp500→sp900). sp900 = S&P 500 + S&P 400 (~903 names; prior cron default pre-Slice 7; available for diagnostics/rollback). sp500 = large-cap only (502 names). The SCHEDULED cron now defaults to sp1500 (Slice 7 cron-default flip). A manual sp900 or sp500 dispatch is available for diagnostics or rollback."
        type: choice
        options:
          - sp500
          - sp900
          - sp1500
          - broad_investable_us
        default: sp1500

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  # S&P 1500 cutover Slice 7 (2026-06-20): the workflow_dispatch `universe` input
  # picks the ingest universe. Default — AND the scheduled cron, where
  # `github.event.inputs` is null — resolves to `sp1500` via the `|| 'sp1500'`
  # fallback (Slice 7 cron-default flip, mirrors #492 sp500→sp900 precedent:
  # sp1500 warm-timing run confirmed compute < 90 min warm + owner go).
  # The weekday cron NOW ranks the full S&P 1500 universe (~1500 names) by default.
  # A manual `universe: sp900` or `universe: sp500` dispatch is available for
  # diagnostics or rollback. This is an `env:`-block assignment, NOT a `run:`-line
  # `${{ }}` interpolation, so it carries no shell script-injection surface
  # (AGENTS.md §Security). Prior value: || 'sp900' (precache-900 Phase B, #492).
  # Revert: change || 'sp1500' back to || 'sp900' and update dispatch input default.
  QR_UNIVERSE: ${{ github.event.inputs.universe || 'sp1500' }}
  # Form-4 bulk fetch RUNS on the cron (observability-only —
  # form4_enabled=False → ZERO scoring impact; it accumulates the
  # form4_* Metadata surface toward the 2026-08-19 Q3 cohort audit).
  # The 2026-05-25 emergency FORM4_FETCH_SKIP=1 was reverted here
  # (Issue #287 PR B) once the durable cron-time fixes landed — PR #297
  # (timeout rebaseline + cache-restore canary + per-loop wall-clocks)
  # and PR #427 (tier2 cache split). Validated on cron run #87 (15m49s
  # warm, tier2 11.2s — ample headroom for Form-4's ~2-3m). The
  # escape-hatch var stays set on pre-merge-prod-sim.yml ONLY (45-min cap).

# Default to read for the workflow; the `compute` job explicitly elevates
# to `contents: write` because its final step `git commit + push`-es the
# generated JSON back to main. Any future job added to this file
# inherits the read default unless it explicitly opts up — least-
# privilege per security-reviewer 2026-05-23 (PR #226 WARN W2).
permissions:
  contents: read

# Issue #249 Option B: precache-edgar.yml (Sat 08:00 UTC) warms the SAME two
# actions/cache bundles this cron restores. Sharing one concurrency group
# guarantees the two cache WRITERS never run at the same time — a dispatched
# cron during a Saturday cold rebuild (or a dispatched precache during a
# weekday run) QUEUES instead of racing it: no duplicate full-cold EDGAR
# crawls, and the precache's post-job save deterministically lands before
# the queued cron restores. `cancel-in-progress: false` (the default, made
# explicit) because a queued run must RUN later, never cancel the in-flight
# one. The scheduled triggers can't overlap by construction (Mon-Fri 22:00
# vs Sat 08:00, both jobs ≤ 240 min) — this group exists for the
# workflow_dispatch paths. pre-merge-prod-sim.yml restores-only and
# backfill-portfolio.yml saves under its own -bf- key, so neither joins.
concurrency:
  group: edgar-cache-writers
  cancel-in-progress: false

jobs:
  # Trading-day gate (2026-06-06): the schedule fires Mon-Fri, but ~9-10 of
  # those weekdays are NYSE full-day holidays where the market is closed and the
  # compute would only recommit a timestamp-bumped no-op (the folded backtest's
  # `generated_utc` always moves). This tiny job (stdlib only — no checkout, no
  # pip install, ~15s) short-circuits those scheduled runs. SAFE BY DESIGN: the
  # default is "run" — only an explicitly-listed holiday sets run=false, and any
  # error fails OPEN (run=true), so a stale/missing list degrades to a harmless
  # no-op run, NEVER a skipped real trading day. A manual `workflow_dispatch`
  # bypasses the gate entirely (see the `compute` job `if:`), so a forced regen
  # on a holiday / after a fix still works.
  trading-day-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is today a US trading day?
        id: check
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          # NYSE full-day closures (observed weekday dates). UPDATE every year or
          # two — an out-of-date / missing entry just lets that holiday run as a
          # harmless no-op (the compute finds no new market data); it can NEVER
          # skip a real trading day because the default is "run". Half-days (1pm
          # closes before Jul 4 / after Thanksgiving / Christmas Eve) are NOT
          # listed — the market traded, so we want those runs.
          NYSE_HOLIDAYS = {
              # 2026
              "2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
              "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25",
              # 2027
              "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
              "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24",
              # 2028
              "2028-01-17", "2028-02-21", "2028-04-14", "2028-05-29", "2028-06-19",
              "2028-07-04", "2028-09-04", "2028-11-23", "2028-12-25",
          }
          try:
              from zoneinfo import ZoneInfo
              et = datetime.now(ZoneInfo("America/New_York")).date()
              run = et.weekday() < 5 and et.isoformat() not in NYSE_HOLIDAYS
              why = "TRADING DAY -> run compute" if run else "market closed (weekend/NYSE holiday) -> skip"
              print(f"ET date {et} (weekday={et.weekday() < 5}): {why}")
          except Exception as exc:  # tzdata missing / any error -> fail OPEN
              run = True
              print(f"gate check errored ({exc!r}) -> fail-open, running compute")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          PY

  compute:
    needs: trading-day-gate
    # Run when the gate says it's a trading day. A manual workflow_dispatch
    # always proceeds (force a regen after a fix / on a holiday). FAIL-OPEN: if
    # the gate JOB itself errored (infra) we still run (`result == 'failure'`),
    # so the gate can never cause a real trading day to be missed; `!cancelled()`
    # is required for this `if` to evaluate at all after a failed `needs`. On a
    # genuine holiday skip the whole compute job — incl. the folded backtest +
    # the commit — is bypassed, so no timestamp-only no-op commit lands.
    if: ${{ !cancelled() && (needs.trading-day-gate.outputs.run == 'true' || needs.trading-day-gate.result == 'failure' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # The `Commit JSON outputs` step at the end of this job is the only
    # writer in the workflow; scope the elevated permission to this job
    # so the workflow-level default stays read.
    permissions:
      contents: write
    # Per-loop cold-cache budget — S&P 1500 EMPIRICAL BASELINE (cron run
    # 27902140692, 2026-06-21, commit 177485d16, ~1504 names):
    #
    #   SP 1500 cold-compute breakdown (measured):
    #     Tier-2 (10-K + 8-K)               ~89 min cold / ~5-10 min warm
    #     Form-4 fetch (EDGAR)               ~72 min cold / ~2-3 min  warm
    #     OSAP + cross-source yfinance.info  ~13 min cold / ~1 min    warm
    #     Prices + fundamentals snapshot     ~10-15 min cold / ~0 min warm (cache hit)
    #     Annual fundamentals history        ~8-12 min  cold / ~0 min warm
    #     Scoring + JSON writes              ~2-3 min
    #     Total cold compute:                ~196 min
    #
    #   + Folded PIT backtest (warm caches):   ~22-55 min
    #   Warm-cache path (all layers hit):      ~45 min estimated
    #
    # Worst-case cold compute + 10% SEC throttle spike: ~215-220 min
    # + folded backtest step (capped 55m):              ~250 min worst-case
    # 270 min ceiling gives ~20 min buffer over the cold worst-case.
    #
    # History:
    # - Phase 3d Part 2: 90m (4-loop reality, warm-cache wall-clock 5m14s)
    # - Phase 4g: 150m (re-enabled 8-K Tier-2, +15-30m)
    # - Phase 4.5e PR #205 (2026-05-22): added Form-4 as 5th EDGAR loop
    #   without bumping the budget → cron cancelled at 150m on 2026-05-25
    #   00:13 UTC after a 44h Fri→Sun cache eviction (incident-commander
    #   session 8 verdict).
    # - Issue #287 PR A (2026-05-28): rebaseline to 195m + cache-restore
    #   canary (surfaces cache eviction in ~30s) + per-loop wall-clock
    #   Metadata observability. Budget: 195m × 5 weekday runs × 4 weeks =
    #   3,900 GitHub Actions minutes/month (~$15 over the 2,000-min free
    #   tier on the paid plan).
    # - Phase 7.0 follow-up (2026-06-06): folded the PIT portfolio backtest
    #   into the cron as a warm step so the AI-pick home page refreshes weekly
    #   without a manual dispatch. The backfill runs AFTER the compute step in
    #   the same job, so it inherits the working-dir caches the compute just
    #   warmed → ~35-45m at the 10Y window (was ~15-20m at 5Y; PR #440 extended
    #   the backtest 5y → 10y, ~doubling the distinct picks 64 → 134, so the
    #   per-pick live-EDGAR amendment fetches the backfill does NOT cache-share
    #   with the compute step grew ~5m → ~10m, atop ~30m PIT scoring). NOT the
    #   ~60m fully-cold budget the standalone backfill-portfolio.yml carries: the
    #   compute step pre-warms the current-universe prices + fundamentals_history
    #   on disk first, and the 214 historical-only ledger members are SKIPPED
    #   (never fetched — backfill pre-loads only the current universe). Capped at
    #   55m + continue-on-error so it can never block the rankings commit (cap was
    #   40m through 2026-06-08; the 10Y warm runtime left only ~5-10m headroom and
    #   a slow-SEC day could kill the step — a kill is benign: the atomic writer
    #   keeps the prior backtest_pit.json and the rankings commit still lands, but
    #   the backtest as_of would stall ~1 week). Job ceiling raised 195 → 225 →
    #   240 → 270 (S&P 1500 cutover: cron run 27902140692 measured ~223 min cold
    #   total vs 240 min budget — only ~7% headroom; a >10% SEC throttle spike
    #   would blow the budget). Cost: warm steady-state adds ~35-45m/run;
    #   worst-case monthly ceiling is now 270m × 5 weekday runs × 4 weeks =
    #   5,400 GitHub Actions minutes/month.
    # - Phase 9.3 runtime prereq (2026-06-29): raised 270 → 420 to cover the
    #   broad-investable-US dry-run (~3,545 names) warm worst-case ~280-320 min
    #   compute + the 55-min folded backtest cap. Owner-authorised billing
    #   increase. The cron universe default STAYS sp1500; 420 min is a headroom
    #   grant for the future wiring PR, not a permanent sp1500 cost shift.
    #   Monthly worst-case at 420m × 5 × 4 = 8,400 min/month (new ceiling).
    # - Phase 9.3 gate-C1 fix (2026-07-02): LOWERED 420 → 360 — 420 was
    #   UNREACHABLE: GitHub Actions hard-caps every job at 6 hours (360
    #   minutes) regardless of `timeout-minutes:`, so a value above 360 is
    #   dead configuration that silently masked the real ceiling. This was
    #   discovered when a single-job cold `universe: broad_investable_us`
    #   dispatch was CANCELLED at the 360-min hard cap with no cache saved
    #   (~480-510 min observed cold — well past both the 360-min hard cap
    #   AND the 280-320 min projection above). The fix is
    #   `.github/workflows/precache-broad-universe.yml`: a dedicated 4-job
    #   sequential split that does the COLD broad-universe EDGAR warming
    #   (each job individually ≤ 360 min) so THIS workflow only ever needs
    #   to run broad-investable-US WARM. sp1500 (the cron default, UNCHANGED)
    #   was already comfortably under 360 min (~223 min cold measured on
    #   run 27902140692) — this bump-down only removes unreachable headroom
    #   for sp1500 and formalises the true ceiling for the dispatch-only
    #   broad-universe path. A warm broad-universe dispatch's actual runtime
    #   is NOT YET empirically confirmed under this new budget — that is the
    #   explicit gate-C2 calibration dry-run scheduled as a follow-up to the
    #   PR that introduced this comment. Monthly worst-case at
    #   360m × 5 × 4 = 7,200 min/month (sp1500 path; the dedicated precache
    #   workflow's own cost is tracked separately, workflow_dispatch-only).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Phase 4h: weekly compute imports compute/ingest/osap.py which
          # imports the `openassetpricing` package — installed via the
          # `factors` extra (pinned to ==0.0.2 in pyproject.toml).
          pip install -e ".[factors]"

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      # Two INDEPENDENT caches (split 2026-06-06, edgar-debugger root-cause of
      # the tier2-cold-every-run bug). The old SINGLE 11-path bundle (~250-500
      # MB) was too large to reliably save in the post-job window once the job
      # ran 100-180m; the save truncated and the largest layers (edgar_10k_text
      # ~50-150 MB, edgar_8k) never persisted, so the next run restored an older
      # bundle WITHOUT them -> Tier-2 ran cold (~80m full SEC re-fetch) ->
      # runtime climbed -> the next save failed again: a self-reinforcing
      # cold-cache trap (cron #82: fundamentals warm p95=11.3s but
      # tier2_wall_clock=4836s = 80.6m). Splitting into two independently-saved
      # caches means losing one never loses the other.

      # FAST-changing bundle — per-quarter key (unchanged: fundamentals is proven
      # warm under this key, so don't touch what works; fundamentals freshness is
      # handled by `_is_fresh()` refetch-by-filing-date). Bump the v on a
      # cache-schema or live-fetch-only value-correctness change:
      #   v4 (PR 4c.1): `_ANNUAL_TAGS` += stockholders_equity
      #   v5 (Issue #288): GOOG/GOOGL per-class XBRL share-override path
      #   v6-fast (Phase 7.0): 10y PRICES_PERIOD/ANNUAL_HISTORY_YEARS flush
      #   v7-fast (Issue #374 RATIFY-B): flush per-class/contaminated parquets
      #     so shares_outstanding repopulates as the company-total aggregate
      #   v8-fast (fixed-floor PR): PRICES_FETCH_START=2015-11-29 replaces period=10y — period-blind parquets from v7 are shallow and must be discarded.
      #   v9-fast (Issue #385, 2026-06-15): us-gaap:OilAndGasRevenue added to
      #     _TTM_REVENUE_TAGS + _ANNUAL_TAGS["revenue"] for E&P filers (APA, COP,
      #     OXY); a new _ANNUAL_TAGS metric that _is_fresh() filing-date checks
      #     can't detect, so the quarter's frozen fast parquets must be flushed.
      #   v10-fast (precache-900 Phase B flip, 2026-06-16): cron-default flip
      #     sp500 → sp900. The fast bundle's exact-key save-skip means sp400
      #     fundamentals/prices won't persist via a warm-key precache; v10 forces
      #     a cold-seed of the full sp900 fast bundle on the first post-flip cron
      #     so all ~903 tickers warm correctly. Also adds sp400/sp900 universe
      #     parquets to the path: block so they persist in the fast bundle.
      #   v11-fast (S&P 1500 cutover Slice 5, 2026-06-20): adds sp600/sp1500
      #     universe parquets to path: so they persist in the fast bundle.
      #     The fast bundle's exact-key save-skip means sp600 fundamentals/prices
      #     written under a warm v10 sp900 key would be silently dropped; v11
      #     forces a cold-seed on the first post-bump cron so all ~1500 tickers
      #     warm correctly once the sp1500 dispatch or Slice 7 cron-default flip
      #     fires. The cron default STAYS sp900 — same mechanism as v9→v10 (#492).
      #   v12-fast (Phase 9.3 runtime prereq, 2026-06-29): adds
      #     compute/cache/broad_universe-v1.parquet to path: so the 7-day-TTL
      #     broad-universe candidate parquet (Phase 9.1) persists across cron runs
      #     without re-fetching the SEC company_tickers.json on every run. The
      #     fast bundle's exact-key save-skip means the parquet written under a
      #     warm v11 key would be silently dropped; v12 forces a cold-seed on the
      #     first post-bump run so the broad-universe file warms correctly. Also
      #     widens the 8-K TTL jitter to 96h (config.EDGAR_8K_CACHE_TTL_JITTER_
      #     SECONDS) so the ~3,545-name cohort does not synchronise on expiry.
      - name: Restore fast caches (fundamentals / prices)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            compute/cache/fundamentals
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe-v2.parquet
            compute/cache/universe_sp400-v1.parquet
            compute/cache/universe_sp900-v1.parquet
            compute/cache/universe_sp600-v1.parquet
            compute/cache/universe_sp1500-v1.parquet
            compute/cache/yfinance_info
            compute/cache/broad_universe-v1.parquet
          key: cache-v12-fast-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v12-fast-${{ steps.quarter.outputs.q }}-
            cache-v12-fast-

      # SLOW-changing text bundle — RUN-ID key + prefix restore-keys (the textbook
      # "keep a cache fresh AND persistent" idiom). A unique key per run means the
      # post-job save is NEVER skipped by actions/cache immutability, so THIS
      # run's freshly-fetched 10-K/8-K text always persists; the `restore-keys`
      # prefix restores the most-recent prior good save. This fixes the actual
      # failure (text never persisting) AND avoids both the static-key 90-day
      # cliff (frozen 10-K cache aging past its TTL with no re-save) and the
      # quarter-rollover cold run. Smaller bundle (no fundamentals weight) also
      # saves more reliably. Bump to text-v6 on a cache-schema change.
      - name: Restore slow text caches (edgar_10k_text / edgar_8k / edgar_form4 / osap)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            compute/cache/edgar_10k_text
            compute/cache/edgar_8k
            compute/cache/edgar_amendments
            compute/cache/edgar_late_filings
            compute/cache/edgar_form4
            compute/cache/osap
          key: cache-v5-text-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cache-v5-text-${{ runner.os }}-

      # Issue #287 PR A, upgraded by Issue #249 Option C — post-restore
      # canary. Emits per-layer size / file count / newest-file age into the
      # log + a $GITHUB_STEP_SUMMARY table BEFORE any SEC fetch begins, so
      # cache eviction (→ cold run) is visible in ~30 s rather than after
      # hours of SEC polling. Dependency-free shell (find/du/awk only).
      # DELIBERATE DEVIATION from issue #249's "loud signal": the cold
      # signal is a ::warning::, NOT a fail-fast — with the Saturday
      # precache (Option B, precache-edgar.yml) in place, a cold cache here
      # usually means an INTENTIONAL rebuild (cache-family vN bump, quarter
      # rollover, post-eviction dispatch), and failing fast would self-abort
      # exactly the run that re-warms the cache.
      # Keep this step textually IDENTICAL to its sibling in
      # precache-edgar.yml so future edits stay in lockstep.
      # Expected steady-state warm sizes (empirical, Issue #287 PR A):
      #   fundamentals/           ~80-120 MB   (502 parquets)
      #   fundamentals_history/   ~40-60 MB    (502 parquets)
      #   prices/                 ~20-40 MB    (502 parquets)
      #   edgar_8k/               ~10-30 MB
      #   edgar_10k_text/         ~50-150 MB   (lazy: ~80% present)
      #   yfinance_info/          ~5-20 MB
      #   edgar_amendments/       ~2-10 MB
      #   edgar_late_filings/     ~1-5 MB
      #   edgar_form4/            ~5-15 MB     (502 dirs)
      #   osap/                   ~1-5 MB      (parquet)
      - name: "Cache restore canary (Issue #287 PR A + #249 Option C)"
        run: |
          echo "=== Cache restore canary (Issues #287 + #249) ==="
          now=$(date +%s)
          {
            echo "## Cache restore canary"
            echo ""
            echo "| Cache layer | Size | Files | Newest-file age |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          emit() {
            path="$1"
            if [ -e "$path" ]; then
              size=$(du -sh "$path" 2>/dev/null | cut -f1)
              files=$(find "$path" -type f 2>/dev/null | wc -l)
              newest=$(find "$path" -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)
              if [ -n "$newest" ]; then
                age="$(awk -v now="$now" -v ts="${newest%.*}" 'BEGIN { printf "%.1f", (now - ts) / 3600 }')h"
              else
                age="empty"
              fi
              echo "  $path: ${size}, ${files} files, newest age ${age}"
              echo "| \`$path\` | $size | $files | $age |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  $path: MISSING (cold — not in restored cache)"
              echo "| \`$path\` | MISSING | 0 | — |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          # Union of the declared cache layers (so MISSING rows still print
          # on a cold runner) + whatever else exists under compute/cache/
          # (so a newly-added layer shows up even before this list is
          # extended).
          layers=$(
            {
              printf '%s\n' \
                compute/cache/fundamentals \
                compute/cache/fundamentals_history \
                compute/cache/prices \
                compute/cache/edgar_8k \
                compute/cache/edgar_10k_text \
                compute/cache/yfinance_info \
                compute/cache/edgar_amendments \
                compute/cache/edgar_late_filings \
                compute/cache/edgar_form4 \
                compute/cache/osap
              find compute/cache -mindepth 1 -maxdepth 1 -type d 2>/dev/null
            } | sort -u
          )
          for d in $layers; do emit "$d"; done
          emit compute/cache/universe-v2.parquet
          # Cold signal: Form-4 + 10-K-text are the two most expensive loops
          # to rebuild (the #249 timeout drivers). Warning, NOT fail-fast —
          # see the step comment above for why.
          form4_n=$(find compute/cache/edgar_form4 -type f 2>/dev/null | wc -l)
          tenk_n=$(find compute/cache/edgar_10k_text -type f 2>/dev/null | wc -l)
          if [ "$form4_n" -eq 0 ] || [ "$tenk_n" -eq 0 ]; then
            echo "::warning::cache cold — expect a long run (see #249)"
            {
              echo ""
              echo "> **WARNING — cache cold**: the Form-4 and/or 10-K-text layer is empty; expect a long run (see #249)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # TTL-proximity warning (Issue #469): the edgar_8k event cache has a
          # 144h (6-day) TTL — config.EDGAR_8K_CACHE_TTL_SECONDS = 6 * 86400. All
          # tickers are written in one cold-rebuild burst, so when the layer's
          # NEWEST file nears 144h the next tier2 pass refetches all of them live
          # (~80 min at sp1500 scale). Recompute that newest-file age the same way
          # emit() does (find -printf '%T@' | sort | tail -1) and warn at > 96h
          # (= 144h TTL - 96h, the config.EDGAR_8K_CACHE_TTL_JITTER_SECONDS window
          # bumped 72h → 96h in Phase 9.3 for broad-investable-US scale) so the
          # long pass is PREDICTED here, not a surprise next run. Warning only —
          # the guarded awk/echo can never fail the job.
          k8_newest=$(find compute/cache/edgar_8k -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)
          if [ -n "$k8_newest" ]; then
            k8_age=$(awk -v now="$now" -v ts="${k8_newest%.*}" 'BEGIN { printf "%.1f", (now - ts) / 3600 }')
            # 96 = 144 (EDGAR_8K_CACHE_TTL_SECONDS, hours) - 96 (EDGAR_8K_CACHE_TTL_JITTER_SECONDS, hours)
            if awk -v a="$k8_age" 'BEGIN { exit !(a > 96) }'; then
              echo "::warning::edgar_8k cache within 96h of its 144h TTL (newest age ${k8_age}h) — next tier2 pass will refetch tickers live (~80 min at sp1500); see #469"
              {
                echo ""
                echo "> **WARNING — edgar_8k near TTL**: newest file is ${k8_age}h old (144h TTL); the next tier2 pass will refetch tickers live (~80 min at sp1500). See #469."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "=== End canary ==="

      - name: Run weekly compute
        run: python -m compute.main

      # PRODUCTION-SAFETY GUARD, complementary half (Phase 9.3 / P1-G4,
      # broad-universe floor-scoping PR-2 prerequisite): the `broad_investable_us`
      # dispatch-only RANKED path (#676) re-bases every cross-sectional
      # percentile + sector median against a ~3,545-name universe with
      # sector="Unknown" (SEC company-tickers has no GICS sector) and a flat-10%
      # CoE fallback — its rankings.json / metadata.json are NOT the S&P 1500 the
      # live site serves and must NEVER be committed (see the "Commit JSON
      # outputs" step's if: below, which skips entirely on this universe). This
      # step is the ONLY way the broad-universe sweep data (the 6
      # broad_universe_survivors_at_*/adr_suspect/coverage/sector_unknown
      # Metadata fields in metadata.json, plus rankings.json for the C5
      # rank-stability comparison) leaves the runner — everything else written
      # to frontend/public/data/ this run evaporates with the discarded
      # checkout once the job ends.
      #
      # Deliberately placed HERE — immediately after compute writes the JSON,
      # BEFORE the optional "Refresh portfolio backtest" step below — rather
      # than at the end of the job next to its complementary commit-step guard.
      # The broad-universe warm runtime is NOT YET empirically confirmed (see
      # the job's timeout-minutes history above: compute alone projects
      # ~280-320 min warm-worst-case against this job's 360-min hard cap), so
      # capturing the artifact right after the data exists — before the
      # skippable-but-still-time-consuming backtest-refresh step gets a chance
      # to run the job past its cap — avoids losing the sweep data to the same
      # "job cancelled, nothing salvaged" failure class the gate-C1 incident
      # hit. An artifact already uploaded by a completed step is retained even
      # if a later step in this same job times out or gets cancelled.
      - name: Upload broad-universe sweep output (artifact, NOT committed)
        if: ${{ env.QR_UNIVERSE == 'broad_investable_us' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: broad-universe-sweep-output
          path: |
            frontend/public/data/metadata.json
            frontend/public/data/rankings.json
          if-no-files-found: error
          retention-days: 30

      # Per-stage timing into the Actions run Summary tab — answers "which stage
      # is slow?" at a glance (e.g. surfaces tier2 at 80m so the cache fix is
      # visibly confirmed when it drops to ~5m next run). `if: always()` so a
      # compute abort still prints what ran. Reads the wall-clock fields compute
      # already writes to metadata.json; prices/fundamentals/scoring/JSON-write
      # timing land in a follow-up PR (need new wall-clock hooks + schema bump).
      - name: Stage timing summary (per-stage wall-clock)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("frontend/public/data/metadata.json")
          if not p.exists():
              print("metadata.json not found — compute did not reach the JSON write.")
              raise SystemExit(0)
          m = json.loads(p.read_text())
          def fmt(v):
              return f"{v/60:.1f} min ({v:.0f}s)" if isinstance(v, (int, float)) else "— (skipped / not reached)"
          def flag(v):
              if not isinstance(v, (int, float)):
                  return "skip"
              return "SLOW" if v > 600 else "ok"
          rows = [
              ("tier2 (10-K + 8-K)", m.get("tier2_wall_clock_seconds")),
              ("Step 8 (cross-source + ensemble + writes)", m.get("cross_source_wall_clock_seconds")),
              ("OSAP", m.get("osap_wall_clock_seconds")),
              ("Form-4", m.get("form4_wall_clock_seconds")),
          ]
          lines = ["## Compute stage timing", "", "| Stage | Status | Wall-clock |", "|---|---|---|"]
          for name, v in rows:
              lines.append(f"| {name} | {flag(v)} | {fmt(v)} |")
          lines += [
              "",
              f"_coverage: fundamentals {m.get('fundamentals_coverage_pct')}% · "
              f"tier2 {m.get('tier2_coverage_pct')}% · fundamentals p95 "
              f"{m.get('fundamentals_latency_p95_seconds')}s_",
              "",
              "_SLOW = stage > 10 min. prices / fundamentals / scoring / JSON-write "
              "timing: follow-up PR._",
          ]
          out = "\n".join(lines)
          print(out)
          sp = os.environ.get("GITHUB_STEP_SUMMARY")
          if sp:
              with open(sp, "a") as fh:
                  fh.write(out + "\n")
          PY

      - name: Refresh portfolio backtest (PIT) — warm caches from the compute step
        # Phase 7.0 follow-up (CLAUDE.md §Next deliverables item b): fold the
        # point-in-time AI-pick backtest into the cron so the home page's NAV +
        # Current picks + Rotation-history stay current weekly instead of needing
        # a manual backfill-portfolio.yml dispatch. It reuses the SAME prices +
        # fundamentals_history + benchmarks.json the compute step just refreshed
        # (warm ~15-20m), and the "Commit JSON outputs" step below already
        # git-adds frontend/public/data/ so backtest_pit.json commits alongside
        # the rankings. The weekly cron is the established SOLE trusted writer to
        # main, so this stays inside the existing trusted write path; the manual
        # backfill-portfolio.yml keeps its `if: ref != main` guard (security-
        # reviewer 2026-06-05) — we are NOT weakening that, only widening what the
        # already-trusted cron commits.
        #
        # continue-on-error + a 55m step cap so a backtest stall / failure can
        # NEVER block the rankings commit: the writer is atomic (tmp + os.replace),
        # so a failed run leaves the prior backtest_pit.json intact and the cron
        # still commits the fresh rankings. FORM4_FETCH_SKIP is irrelevant here —
        # the backfill's veto set is the 7 active rank-gates, none Form-4.
        continue-on-error: true
        timeout-minutes: 55
        run: python -m scripts.backfill_portfolio_pit

      - name: Show backtest meta (canary)
        # Per-run visibility that the folded backtest refresh actually completed.
        # The backfill step is continue-on-error, so without this a silent kill /
        # failure would leave no signal in the cron log. Mirrors the canary in
        # backfill-portfolio.yml. `generated_utc` is the tell: if it is THIS run's
        # timestamp the refresh landed; if it is stale the backfill was killed at
        # the 55m cap and the prior (atomic) artifact is what will be committed.
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("frontend/public/data/portfolio/backtest_pit.json")
          if p.exists():
              meta = json.loads(p.read_text()).get("meta", {})
              for k in ("generated_utc", "as_of_end", "rebalance_count",
                        "restatement_contamination_pct"):
                  print(f"  {k}: {meta.get(k)}")
          else:
              print("  backtest_pit.json NOT present")
          PY

      - name: Commit JSON outputs
        # PRODUCTION-SAFETY GUARD (Phase 9.3 / P1-G4, broad-universe
        # floor-scoping PR-2 prerequisite): SKIPPED entirely when the resolved
        # universe is `broad_investable_us`. That dispatch-only RANKED path
        # (#676) re-bases every cross-sectional percentile + sector median
        # against a ~3,545-name candidate pool with sector="Unknown" (SEC
        # company-tickers carries no GICS sector) and a flat-10%-CoE fallback —
        # its rankings.json / metadata.json / stocks/*.json are NOT comparable
        # to the S&P 1500 the live site serves and must NEVER land on `main`:
        # Vercel rebuilds from whatever frontend/public/data/ holds on `main`,
        # so committing here would make the live site show broad-universe
        # scores instead of the S&P 1500, AND prune_orphan_stock_files() would
        # delete every sp1500 per-stock JSON (the ~3,545-name broad ticker set
        # only partially overlaps the ~1504-name sp1500 set). The frontend
        # disclaimer needed to safely surface a broad-universe run is Phase 9.4
        # scope — until it ships, this if: is the ONLY thing standing between a
        # broad dispatch and a corrupted production site.
        #
        # env.QR_UNIVERSE (line ~34: `${{ github.event.inputs.universe ||
        # 'sp1500' }}`) is the single resolved value already fed to `python -m
        # compute.main` above — reusing it here (rather than re-deriving from
        # github.event.inputs) keeps this guard in lockstep with whatever that
        # fallback resolves to. Every other value — sp500 / sp900 / sp1500, AND
        # the scheduled cron, where github.event.inputs is null and
        # QR_UNIVERSE resolves to sp1500 — takes this branch and commits
        # EXACTLY as before (pure add-on; the non-broad paths are
        # byte-identical). The broad-universe sweep data itself is captured by
        # the "Upload broad-universe sweep output" step above instead — see
        # its comment for why that step is placed there rather than directly
        # adjacent to this one.
        if: ${{ env.QR_UNIVERSE != 'broad_investable_us' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          # Research warehouse (Slice 1): the per-run PIT snapshot + run manifest
          # under data/warehouse/ (gitignore-whitelisted) ride the same commit.
          # Also covered by this step's if: above — a broad-universe run's
          # warehouse snapshot is skipped alongside the JSON commit, for the
          # same re-basing / not-comparable reason.
          git add data/warehouse/
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: update rankings $(date -u +%Y-%m-%d)"
            # Compute can take 30-50 min; during that window other PRs can
            # land on main (docs PRs, hotfixes). Rebase-then-push so the
            # bot commit cleanly stacks on top of whatever moved. Without
            # this, workflow #30 (2026-05-14) failed: push rejected because
            # main had advanced by 2 docs PRs during the 52-min compute.
            # The bot commit only touches `frontend/public/data/` so it
            # never conflicts with code/docs changes — rebase is safe.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $attempt failed; refetching and retrying."
              sleep $((attempt * 5))
            done
          fi
