name: Compute Rankings

on:
  schedule:
    - cron: "0 22 * * 0"  # Sunday 22:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      - name: Restore fundamentals cache
        uses: actions/cache@v4
        with:
          path: compute/cache/fundamentals
          key: fundamentals-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            fundamentals-${{ steps.quarter.outputs.q }}-
            fundamentals-

      - name: Run weekly compute
        run: python -m compute.main

      - name: Commit JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: update rankings $(date -u +%Y-%m-%d)"
            git push
          fi
