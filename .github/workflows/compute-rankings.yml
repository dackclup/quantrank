name: Compute Rankings

on:
  schedule:
    - cron: "0 22 * * 0"  # Sunday 22:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      - name: Restore compute caches (PR 4a — multi-path)
        uses: actions/cache@v5
        with:
          # PR 4a (workflow-cache-improvements/PLAN.md): six cache layers
          # exist in code (fundamentals, fundamentals_history, prices,
          # universe, edgar_8k, edgar_10k_text) but only `fundamentals`
          # was restored across CI runs. Each missing path forced a cold
          # re-fetch every weekly run — 10-K text alone hit ~5-15 min for
          # going-concern + ~2-3 min for yfinance OHLCV prices. With all
          # six restored, steady-state weekly compute drops from ~25-30
          # min to ~10-15 min.
          #
          # Cache key bumped to `cache-v3` to atomically rotate ALL six
          # paths together. Pre-v3 keys (fundamentals-v2-*) only held one
          # path; partial restore-key matches could resurrect a stale
          # partial state. Bump to v4 if any cache directory's *schema*
          # changes (parquet column rename, JSON shape change, etc.).
          # Value drift is covered by per-cache `_is_fresh()` checks in
          # compute/ingest/*.py — those run regardless of key.
          path: |
            compute/cache/fundamentals
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe.parquet
            compute/cache/edgar_8k
            compute/cache/edgar_10k_text
          key: cache-v3-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v3-${{ steps.quarter.outputs.q }}-
            cache-v3-

      - name: Run weekly compute
        run: python -m compute.main

      - name: Commit JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: update rankings $(date -u +%Y-%m-%d)"
            # Compute can take 30-50 min; during that window other PRs can
            # land on main (docs PRs, hotfixes). Rebase-then-push so the
            # bot commit cleanly stacks on top of whatever moved. Without
            # this, workflow #30 (2026-05-14) failed: push rejected because
            # main had advanced by 2 docs PRs during the 52-min compute.
            # The bot commit only touches `frontend/public/data/` so it
            # never conflicts with code/docs changes — rebase is safe.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $attempt failed; refetching and retrying."
              sleep $((attempt * 5))
            done
          fi
