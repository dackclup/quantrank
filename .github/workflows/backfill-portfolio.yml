name: Backfill Portfolio Backtest

# Phase 7.0 PR-2b — the point-in-time 5-year portfolio backtest is a ONE-OFF
# committed artifact, NOT per-cron (it never changes for past dates). Run this
# manually (or quarterly) to (re)generate frontend/public/data/portfolio/
# backtest_pit.json. It reuses the weekly cron's warm price + fundamentals_history
# caches — run it shortly after a green compute-rankings cron for a fast (~15-20m)
# pass; a cold cache forces a full re-fetch (~60m).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Window start YYYY-MM-DD (default: 5 years ago)"
        required: false
      end:
        description: "Window end YYYY-MM-DD (default: today)"
        required: false

env:
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # SECURITY (security-reviewer FAIL, 2026-06-05): never let a
    # workflow_dispatch against `main` commit the artifact straight to the
    # protected branch. The backfill is meant to run on a FEATURE branch and
    # land its data via PR review; the weekly cron (compute-rankings.yml) is the
    # only writer to `main`. This guard blocks the dispatch-against-main path.
    if: github.ref_name != 'main'
    # Only the final commit step writes; scope write to this job.
    permissions:
      contents: write
    # Budget: ~20 quarterly rebalances x ~500 names x (cache-load + score). Warm
    # cache ~15-20m; fully-cold (price + fundamentals_history re-fetch) ~60m; 120m
    # leaves headroom. A timeout commits nothing (the artifact is all-or-none).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[factors]"

      - name: Compute current quarter id
        id: quarter
        run: echo "q=$(date -u +%Y)Q$(( ($(date -u +%-m)-1)/3 + 1 ))" >> $GITHUB_OUTPUT

      # The backfill only needs prices + annual fundamentals_history (it builds
      # synthetic point-in-time snapshots from the latter; the live TTM snapshot
      # cache is NOT used). Same cache key family as compute-rankings so a recent
      # cron's warm cache is reused.
      # v8-fast (fixed-floor PR): PRICES_FETCH_START=2015-11-29 replaces period=10y — period-blind parquets from v7 are shallow and must be discarded.
      # v10-fast (precache-900 Phase B flip, 2026-06-16): align with the cron's
      # v10 key family so the backfill restores the sp900-warmed fast bundle.
      # v11-fast (S&P 1500 cutover Slice 5, 2026-06-20): align with the cron's
      # v11 key family + add sp600/sp1500 universe parquets to path: block.
      # v12-fast (Phase 9.3 runtime prereq, 2026-06-29): align with the cron's
      # v12 key family so this restore borrows the v12 fast bundle that the
      # cron saves. No broad_universe-v1.parquet needed here (backfill does
      # not run the broad-universe probe).
      - name: Restore compute caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            compute/cache/fundamentals_history
            compute/cache/prices
            compute/cache/universe-v2.parquet
            compute/cache/universe_sp400-v1.parquet
            compute/cache/universe_sp900-v1.parquet
            compute/cache/universe_sp600-v1.parquet
            compute/cache/universe_sp1500-v1.parquet
            compute/cache/edgar_amendments
          # Distinct SAVE key (-bf-): this job bundles a SUBSET of the cron's fast
          # dirs — saving under the cron's exact key would poison the quarter with
          # an impoverished archive (the cron exact-hits it and never re-saves).
          # Restore still borrows the cron's family via restore-keys below.
          key: cache-v12-bf-${{ steps.quarter.outputs.q }}-${{ runner.os }}
          restore-keys: |
            cache-v12-fast-${{ steps.quarter.outputs.q }}-
            cache-v12-fast-

      # The backfill READS frontend/public/data/portfolio/benchmarks.json for the
      # SPY/QQQ/DIA/IWM comparison lines but does NOT produce it — that file is a
      # weekly-cron output (compute/main.py write_benchmarks_json), and the cron
      # that introduced the writer has not committed it yet. Regenerate it here so a
      # SINGLE dispatch yields a benchmark-complete artifact instead of a backtest
      # with empty comparison lines (and without waiting ~17h for the next cron).
      # Cheap: 4 yfinance close-series fetches via the same trusted code path as the
      # cron; if benchmarks.json is later committed by a cron this just refreshes it.
      - name: Generate benchmark series (benchmarks.json)
        run: |
          python - <<'PY'
          from compute import config
          from compute.ingest.prices import fetch_benchmarks
          from compute.output.writer import write_benchmarks_json
          path, coverage = write_benchmarks_json(fetch_benchmarks(), config.DATA_DIR)
          print(f"  benchmarks.json -> {path} (coverage {coverage:.1f}%)")
          PY

      - name: Run point-in-time backfill
        # Inputs go through env, NEVER interpolated straight into the run script
        # (template `${{ inputs.* }}` in a shell line is the classic Actions
        # script-injection vector). The backfill also validates each via
        # date.fromisoformat, so a bad value fails loudly rather than running.
        env:
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          ARGS=""
          if [ -n "$IN_START" ]; then ARGS="$ARGS --start $IN_START"; fi
          if [ -n "$IN_END" ]; then ARGS="$ARGS --end $IN_END"; fi
          python -m scripts.backfill_portfolio_pit $ARGS

      - name: Show backtest meta (canary)
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("frontend/public/data/portfolio/backtest_pit.json")
          if p.exists():
              meta = json.loads(p.read_text()).get("meta", {})
              for k in ("as_of_start","as_of_end","rebalance_count","incomplete_membership_count",
                        "restatement_contamination_pct","sector_from_today","veto_layer_replayed"):
                  print(f"  {k}: {meta.get(k)}")
          else:
              print("  backtest_pit.json NOT written")
          PY

      - name: Commit backtest artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit BOTH portfolio artifacts: the freshly-regenerated benchmarks.json
          # (the comparison index series) and the backtest_pit.json the frontend reads.
          git add frontend/public/data/portfolio/
          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
          else
            git commit -m "chore: backfill portfolio backtest $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin HEAD:"${GITHUB_REF_NAME}" && break
              echo "Push attempt $attempt failed; retrying."
              sleep $((attempt * 5))
            done
          fi
