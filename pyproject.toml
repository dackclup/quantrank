[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantrank-compute"
version = "1.3.0"
description = "QuantRank compute pipeline — static-site US equity ranking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "pydantic>=2.6",
  "tenacity>=8.2",
  "yfinance>=0.2.40",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "requests>=2.31",
  "pyarrow>=15.0",
  # 2026-05-22 hotfix: pin to 5.x band. edgartools 5.x reclassified
  # ``Filing.obj`` from a property to a method, which caused the
  # 502/502 Form-4 silent-drop on the first post-PR-#205 cron. The
  # caller in ``compute/scoring/form4_insider.py`` now handles both
  # shapes via ``callable()`` so a future 6.x revert is safe, but the
  # upper bound here guards against a 6.x major-version footgun
  # slipping in via ``>=2.30`` (no upper bound was the original gap).
  "edgartools>=5.30,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  # Property-based testing — Process Hygiene Item #1 (issue #126).
  # Hypothesis generates random inputs to catch data-shape bugs that
  # example-based tests miss (the class of bug that hid the
  # quintile/tercile silent-drop in OSAP_SIGNALS_100 from PR #112's
  # CI until production cron diagnostics caught it 2026-05-19).
  "hypothesis>=6.92",
]
# Phase 4 factor libraries. Heavy transitive deps (wrds, polars,
# psycopg2-binary, sqlalchemy, ipython) — kept out of the base install
# so frontend builds, contributor onboarding, and anyone running only
# the compute pipeline stay lean. Weekly compute CI installs
# ".[factors]" once openassetpricing is consumed by scoring (Phase 4h);
# the scout PR installs it solely for offline import + API-surface tests.
factors = [
  "openassetpricing==0.0.2",
  # Phase 4j scout — Microsoft Qlib (Alpha158). MIT licensed (verified
  # via wheel METADATA 2026-05-19). Pin to 0.9.x so any future feature-
  # set drift in 0.10+ requires a deliberate manual upgrade and
  # re-verification of `ALPHA158_FEATURE_NAMES`. Pulls ~22 transitive
  # deps (mlflow, lightgbm, cvxpy, pymongo, redis, gym, jupyter,
  # nbconvert, etc.); CI install footprint bump ~150-180 MB.
  "pyqlib>=0.9.7,<0.10",
  # Phase 4k scout — Kelly-Pruitt-Su IPCA latent factor model. MIT
  # licensed (verified via LICENSE.md 2026-05-19). Pin to 0.6.x band
  # because upstream last released 2021-04-22 (~5 years stale); any
  # future minor would require deliberate manual upgrade + re-
  # verification of the 8-method `INSTRUMENTED_PCA_PUBLIC_API` tuple.
  # Heavy transitive: numba (~50 MB w/ llvmlite ~30 MB); CI install
  # footprint bump ~50-80 MB — substantially lighter than pyqlib.
  "ipca>=0.6.7,<0.7",
]

[tool.setuptools.packages.find]
include = ["compute*"]
exclude = ["tests*", "frontend*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "frontend",
  "compute/cache",
  "models",
  # Vendored upstream skills with their own Python helpers; not ours to lint.
  ".claude/skills/docx",
  ".claude/skills/pdf",
  ".claude/skills/pptx",
  ".claude/skills/xlsx",
  ".claude/skills/webapp-testing",
  ".claude/skills/mcp-builder",
  ".claude/skills/skill-creator",
  ".claude/skills/algorithmic-art",
  ".claude/skills/canvas-design",
  ".claude/skills/slack-gif-creator",
  ".claude/skills/web-artifacts-builder",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
