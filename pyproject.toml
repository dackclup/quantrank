[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantrank-compute"
version = "0.3.0"
description = "QuantRank compute pipeline — static-site US equity ranking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "pydantic>=2.6",
  "tenacity>=8.2",
  "yfinance>=0.2.40",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "requests>=2.31",
  "pyarrow>=15.0",
  "edgartools>=2.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["compute*"]
exclude = ["tests*", "frontend*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "frontend",
  "compute/cache",
  "models",
  # Vendored upstream skills with their own Python helpers; not ours to lint.
  ".claude/skills/docx",
  ".claude/skills/pdf",
  ".claude/skills/pptx",
  ".claude/skills/xlsx",
  ".claude/skills/webapp-testing",
  ".claude/skills/mcp-builder",
  ".claude/skills/skill-creator",
  ".claude/skills/algorithmic-art",
  ".claude/skills/canvas-design",
  ".claude/skills/slack-gif-creator",
  ".claude/skills/web-artifacts-builder",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
